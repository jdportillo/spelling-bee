                <div style={{textAlign:"center",padding:"8px 0"}}>
                  <p style={{color:"#22c55e",fontSize:".84rem",marginBottom:6}}>✅ Tu acta fue confirmada.</p>
                  {!allDone && <p style={{color:"#4B5A78",fontSize:".76rem"}}>Esperando a los demás jurados ({confirmedCount}/{judgeCount})...</p>}
                  {allDone && <p style={{color:"#22c55e",fontSize:".84rem",fontWeight:700}}>✅ Todos confirmaron — sala cierra en 36h.</p>}
                </div>
              )}
            </div>

          )}
          {(isMC||isPresenter||isCreator) && !isJudge && (
            <div style={{display:"flex",flexDirection:"column",gap:10,padding:"8px 0"}}>
              <p style={{color:"#4B5A78",fontSize:".82rem",lineHeight:1.6}}>
                {isCreator?"Como configurador puedes descargar el acta de cada jurado:":""}
              </p>
              {isCreator && (gs?.judges||[]).map(j=>(
                <button key={j.id} className="btn btn-pdf" style={{width:"100%",padding:10,justifyContent:"flex-start",gap:10,fontSize:".84rem"}}
                  onClick={()=>doPrintJudgeActa(j.id)}>
                  📄 Acta de {j.name}
                </button>
              ))}
              <p style={{color:"#4B5A78",fontSize:".74rem",marginTop:6}}>
                Confirmaciones de jurados: {confirmedCount}/{judgeCount} {allDone?"✅":"⏳"}
              </p>
              {allDone && <p style={{color:"#22c55e",fontSize:".78rem"}}>La sala se cerrará 36 horas después de la última confirmación.</p>}
            </div>
          )}
        </div>
        <button className="btn btn-ghost" style={{fontSize:".82rem",padding:"8px 18px",color:"#ef4444"}} onClick={doLeaveRoom}>🚪 Salir de la sala</button>
      </div>
    );
  }

  /* COMPETITION */
  if (!gs || screen!=="competition") return (
    <div className="sb" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <style>{CSS}</style>
      <p className="pulse" style={{color:"#4B5A78"}}>Cargando...</p>
    </div>
  );

  return (
    <div className="sb" style={{maxWidth:680,margin:"0 auto",padding:"16px 14px 80px"}}>
      <style>{CSS}</style>
      {LtrModal}{OvrModal}{DisputeModal}{ShareOverlay}
      {showRoomsPanel && <RoomsPanel visible={showRoomsPanel} onClose={()=>setShowRoomsPanel(false)} adminUser={adminUser} userRooms={userRooms} allRooms={allRooms} onEnter={doEnterRoomAsMC} onClose2={doCloseRoom} onDelete={doDeleteRoom} onOpenAdmin={()=>setShowAdmin(true)}/>}

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,paddingTop:6}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <BeeLogo size={28}/>
          <span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 13px",borderRadius:18,fontSize:".74rem",fontWeight:700,background:stCol+"1A",border:"1px solid "+stCol+"45",color:stCol}}>
            Etapa {cfg?.label}
            {gs.stage==="tiebreaker"&&gs.tbRound>0&&<span style={{opacity:.7}}> · Ronda {gs.tbRound+1}</span>}
          </span>
          {(isMC||isCreator)&&<span style={{fontSize:".68rem",color:"#2D3A55",marginLeft:8}}>{active.length} activos</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{color:"#4B5A78",fontSize:".76rem"}}>{isMC?(gs?.mc?.name||"Maestro de Ceremonia"):isPresenter?(gs?.presenter?.name||"Presentador"):myJudge?.name||"Jurado"}</span>
          <span style={{fontSize:".62rem",color:"#2D3A55",padding:"1px 6px",background:"rgba(34,197,94,.06)",borderRadius:8}} title={"Dispositivo: "+DEVICE_ID}>🔒</span>
          {(isMC||isCreator) && (
            <>
              <button className="btn btn-ghost" style={{fontSize:".7rem",padding:"4px 10px"}} onClick={()=>setShowShare(true)}>📤</button>
              <button className="btn btn-ghost" style={{fontSize:".7rem",padding:"4px 10px"}} onClick={()=>setScreen("setup")}>⚙ Config</button>
              {adminUser&&<button className="btn btn-ghost" style={{fontSize:".7rem",padding:"4px 10px",color:"#E8A200"}} onClick={()=>setShowRoomsPanel(true)}>🏠</button>}
            </>
          )}
          <button className="btn btn-ghost" style={{fontSize:".7rem",padding:"4px 10px",color:"#ef4444"}} onClick={doLeaveRoom}>🚪 Salir</button>
        </div>
      </div>

      {/* Dispute indicator */}
      {pendingDisputes.length>0 && (
        <button className="btn" style={{width:"100%",marginBottom:10,background:"rgba(251,191,36,.15)",color:"#fbbf24",border:"1px solid rgba(251,191,36,.35)",padding:10,fontSize:".84rem"}} onClick={()=>setDisputeModal(true)}>
          ⚠️ Hay {pendingDisputes.length} discrepancia(s) pendiente(s) — Clic para deliberar
        </button>
      )}
      {/* Concursante actual */}
      {cur && !gs.stageComplete && (
        <div className="card fade-up" style={{marginBottom:14,borderColor:stCol+"35"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <p style={{color:"#4B5A78",fontSize:".68rem",fontWeight:700,letterSpacing:".07em",marginBottom:4}}>CONCURSANTE ACTUAL</p>
              <h2 style={{fontFamily:"'Cormorant Garamond',serif",color:"#E8EDF8",fontSize:"1.65rem",fontWeight:700}}>{cur.name}</h2>
            </div>
            <div style={{textAlign:"right"}}>
              <p style={{color:"#4B5A78",fontSize:".68rem",fontWeight:700,letterSpacing:".07em",marginBottom:4}}>PALABRA</p>
              <p style={{color:"#E8EDF8",fontWeight:700}}>{gs.stage==="tiebreaker"?"Desempate":(gs.slot+1)+" / "+wpr}</p>
            </div>
          </div>
          {gs.stage!=="tiebreaker" && (
            <div style={{display:"flex",gap:5,marginTop:10}}>
              {Array.from({length:wpr}).map((_,i)=>{
                const sv=gs.scores[gs.stage]?.[cur.id]?.v?.[i];
                return <div key={i} className="dot" style={{background:sv==="correct"?"#22c55e":sv==="incorrect"?"#ef4444":i===gs.slot&&!aw?stCol+"60":"rgba(255,255,255,.1)"}}/>;
              })}
            </div>
          )}
        </div>
      )}

      {/* Área de Concurso — Flujo por fases */}
      {!gs.stageComplete && (
        <div className="card" style={{marginBottom:14,minHeight:220,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:18}}>

          {/* IDLE */}
          {(!gs.wordPhase||gs.wordPhase==="idle") && (
            <div style={{textAlign:"center"}}>
              <p style={{color:"#4B5A78",marginBottom:18}}>El concurso está listo para comenzar.</p>
              {isController && <button className="btn btn-gold" style={{padding:"12px 32px"}} onClick={doStartContestants}>▶ Iniciar Concurso</button>}
              {!isController&&<p style={{color:"#2D3A55"}}>Esperando a quien dirige el concurso...</p>}
            </div>
          )}

          {/* CONTESTANT REVEAL — judges press ready */}
          {gs.wordPhase==="contestant_reveal" && cur && Array.isArray(gs.contestants) && (
            <div style={{textAlign:"center",width:"100%"}} className="fade-up">
              <p style={{color:"#2D3A55",fontSize:".72rem",fontWeight:700,letterSpacing:".08em",marginBottom:6}}>TURNO {(gs.cIdx||0)+1} DE {active.length} · ORDEN DE LA LISTA</p>
              {isPresenter && (
                <>
                  <p style={{color:"#4B5A78",fontSize:".75rem",marginBottom:8}}>Próximo concursante:</p>
                  <p className="word-font" style={{fontSize:"2rem",color:"#E8A200"}}>{cur.name}</p>
                </>
              )}
              {isJudge && (
                <>
                  <p style={{color:"#4B5A78",fontSize:".8rem",marginBottom:8}}>Concursante:</p>
                  <p className="word-font" style={{fontSize:"2rem",color:"#E8EDF8",marginBottom:16}}>{cur.name}</p>
                  <button className="btn btn-gold" style={{padding:"13px 36px"}}
                    onClick={doJudgeReady} disabled={!!(gs.judgesReady||{})[role]}>
                    {(gs.judgesReady||{})[role]?"✅ Listo":"✋ Listo — presiona cuando estés preparado"}
                  </button>
                  <p style={{color:"#4B5A78",fontSize:".72rem",marginTop:8}}>
                    Listos: {Object.keys(gs.judgesReady||{}).length}/{numJudges}
                  </p>
                </>
              )}
              {(isMC||isCreator) && (
                <>
                  <p style={{color:"#4B5A78",fontSize:".8rem",marginBottom:6}}>En turno:</p>
                  <p className="word-font" style={{fontSize:"2rem",color:"#E8EDF8"}}>{cur.name}</p>
                  <p style={{color:"#2D3A55",fontSize:".8rem",marginTop:10}}>
                    Esperando que los {numJudges} jurados confirmen listos... ({Object.keys(gs.judgesReady||{}).length}/{numJudges})
                  </p>
                </>
              )}
            </div>
          )}

          {/* WORD SHOW */}
          {gs.wordPhase==="word_show" && cur && (()=>{
            const cw=(gs.currentWords||[])[gs.currentWordIdx||0];
            const wi=gs.currentWordIdx||0;
            const myVote=((gs.wordJudgments||{})[wi]||{})[role];
            const totalVotes=Object.keys((gs.wordJudgments||{})[wi]||{}).length;
            return (
              <div style={{width:"100%",textAlign:"center"}} className="pop">
                <p style={{color:"#4B5A78",fontSize:".72rem",marginBottom:4}}>{cur.name} — Palabra {wi+1} de 3</p>
                <div className="word-font" style={{fontSize:"clamp(1.8rem,5vw,3rem)",marginBottom:8,color:"#22c55e"}}>{(cw?.word||"").toUpperCase()}</div>
                <div className="ph-font" style={{fontSize:"1rem",marginBottom:14}}>{cw?.phonetic||""}</div>
                {isJudge && !myVote && (() => {
                  const letters=(cw?.word||"").split("");
                  const REASONS=[
                    {id:"no_before",  ico:"🗣", lbl:"No dijo\nal inicio"},
                    {id:"no_after",   ico:"🗣", lbl:"No dijo\nal final"},
                    {id:"too_slow",   ico:"⏱", lbl:"No empezó\na tiempo"},
                    {id:"discontinuous",ico:"⏸",lbl:"Deletreo\ndiscontinuo"},
                  ];
                  const RLABELS={
                    no_before:"No pronunció la palabra al inicio",
                    no_after:"No pronunció la palabra al final",
                    too_slow:"No inició en tiempo (>10 seg)",
                    discontinuous:"Deletreo discontinuo / se detuvo",
                  };
                  const hasSelection=markedLetterIdx!==null||markedReason!==null;
                  const selParts=[];
                  if(markedLetterIdx!==null) selParts.push("Letra: "+((cw?.word||"")[markedLetterIdx]||"").toUpperCase()+" (pos. "+(markedLetterIdx+1)+")");
                  if(markedReason) selParts.push(RLABELS[markedReason]||markedReason);
                  return (
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>

                      {/* Letter tiles */}
                      <div style={{width:"100%"}}>
                        <p style={{fontSize:".68rem",color:"#4B5A78",letterSpacing:"1px",marginBottom:5,fontWeight:600}}>
                          LETRA INCORRECTA <span style={{fontWeight:400,opacity:.7}}>(opcional — toca la letra)</span>
                        </p>
                        <div style={{display:"flex",flexWrap:"wrap",gap:4,justifyContent:"center"}}>
                          {letters.map((ch,i)=>{
                            const isW=markedLetterIdx===i;
                            return(
                              <button key={i}
                                onClick={()=>setMarkedLetterIdx(isW?null:i)}
                                title={"Marcar "+ch.toUpperCase()+" como incorrecta"}
                                style={{
                                  width:ch===" "?"14px":"32px",minWidth:ch===" "?"14px":"32px",
                                  height:"40px",borderRadius:7,fontWeight:700,fontSize:"1rem",
                                  cursor:"pointer",fontFamily:"inherit",
                                  display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                                  gap:1,lineHeight:1,
                                  background:isW?"#dc2626":"rgba(255,255,255,.07)",
                                  color:isW?"#fff":"#E8EDF8",
                                  border:isW?"2px solid #ef4444":"1px solid rgba(255,255,255,.15)",
                                  transform:isW?"scale(1.1)":"scale(1)",
                                  transition:"all .12s",
                                  boxShadow:isW?"0 0 0 3px rgba(239,68,68,.25)":"none",
                                }}>
                                {ch===" "?"·":ch.toUpperCase()}
                                {isW&&<span style={{fontSize:"7px",opacity:.8}}>✕ {i+1}</span>}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {/* Reason buttons */}
                      <div style={{width:"100%"}}>
                        <p style={{fontSize:".68rem",color:"#4B5A78",letterSpacing:"1px",marginBottom:5,fontWeight:600}}>
                          RAZÓN <span style={{fontWeight:400,opacity:.7}}>(opcional)</span>
                        </p>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
                          {REASONS.map(r=>{
                            const isSel=markedReason===r.id;
                            return(
                              <button key={r.id}
                                onClick={()=>setMarkedReason(isSel?null:r.id)}
                                style={{
                                  padding:"7px 5px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",
                                  textAlign:"center",lineHeight:1.4,fontSize:"9px",
                                  border:isSel?"1px solid rgba(245,158,11,.5)":"1px solid rgba(255,255,255,.1)",
                                  background:isSel?"rgba(245,158,11,.13)":"rgba(255,255,255,.05)",
                                  color:isSel?"#f59e0b":"#6B7FA3",
                                  transition:"all .12s",
                                }}>
                                <span style={{fontSize:"15px",display:"block",marginBottom:2}}>{r.ico}</span>
                                {r.lbl}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {/* Selection summary */}
                      <div style={{
                        width:"100%",minHeight:24,borderRadius:7,padding:"5px 8px",
                        background:hasSelection?"rgba(239,68,68,.08)":"rgba(255,255,255,.03)",
                        border:"1px solid "+(hasSelection?"rgba(239,68,68,.2)":"rgba(255,255,255,.07)"),
                        fontSize:".74rem",color:hasSelection?"#ef4444":"#4B5A78",textAlign:"center",
                      }}>
                        {hasSelection
                          ? selParts.join(" · ")
                          : "Nada seleccionado — puedes votar directo"}
                      </div>

                      {/* Verdict buttons */}
                      <div style={{display:"flex",gap:8,width:"100%"}}>
                        <button className="btn btn-green" style={{flex:1,padding:"10px 0",fontSize:".9rem"}}
                          onClick={()=>{doJudgeWordVerdict("correct",null);setMarkedLetterIdx(null);setMarkedReason(null);}}>
                          ✅ Correcta
                        </button>
                        <button className="btn btn-red" style={{flex:1,padding:"10px 0",fontSize:".9rem"}}
                          onClick={()=>{
                            const errInfo=(markedLetterIdx!==null||markedReason)
                              ?{
                                  letterIdx:markedLetterIdx,
                                  letter:markedLetterIdx!==null?(cw?.word||"")[markedLetterIdx]:null,
                                  reason:markedReason||null,
                                }
                              :null;
                            doJudgeWordVerdict("incorrect",errInfo);
                            setMarkedLetterIdx(null);setMarkedReason(null);
                          }}>
                          ❌ Incorrecta
                        </button>
                      </div>

                    </div>
                  );
                })()}
                {isJudge && myVote && (
                  <div style={{background:myVote.verdict==="correct"?"rgba(22,163,74,.08)":"rgba(220,38,38,.08)",
                    border:"1px solid "+(myVote.verdict==="correct"?"rgba(22,163,74,.25)":"rgba(220,38,38,.25)"),
                    borderRadius:10,padding:"10px 12px",textAlign:"center"}}>
                    <p style={{fontWeight:700,fontSize:"1rem",color:myVote.verdict==="correct"?"#22c55e":"#ef4444",marginBottom:4}}>
                      {myVote.verdict==="correct"?"✅ Marcaste: Correcta":"❌ Marcaste: Incorrecta"}
                    </p>
                    {myVote.verdict==="incorrect" && (myVote.err?.letter||myVote.err?.reason) && (
                      <div style={{fontSize:".75rem",color:"#ef4444",lineHeight:1.6}}>
                        {myVote.err?.letter && (
                          <span>Letra: <strong style={{letterSpacing:2}}>{myVote.err.letter.toUpperCase()}</strong> (pos. {(myVote.err?.letterIdx||0)+1})</span>
                        )}
                        {myVote.err?.letter && myVote.err?.reason && <span> · </span>}
                        {myVote.err?.reason && (
                          <span>{{no_before:"No dijo al inicio",no_after:"No dijo al final",too_slow:"No empezó a tiempo",discontinuous:"Deletreo discontinuo"}[myVote.err.reason]||myVote.err.reason}</span>
                        )}
                      </div>
                    )}
                    {myVote.verdict==="incorrect" && !myVote.err?.letter && !myVote.err?.reason && (
                      <p style={{fontSize:".72rem",color:"rgba(239,68,68,.6)"}}>Sin detalle adicional</p>
                    )}
                  </div>
                )}
                {!isJudge && <p style={{color:"#4B5A78"}}>{totalVotes}/{numJudges} jurados calificaron</p>}
              </div>
            );
          })()}

          {/* DELIBERATION */}
          {gs.wordPhase==="deliberation" && (()=>{
            const unresolved=(gs.discrepancies||[]).filter(d=>!d.resolved);
            const disc=unresolved[0];
            if(!disc) return null;
            const discIdx=(gs.discrepancies||[]).findIndex(d=>!d.resolved);
            return (
              <div style={{width:"100%"}} className="fade-up">
                <p style={{color:"#fbbf24",fontWeight:700,fontSize:".8rem",marginBottom:8}}>⚠ DISCREPANCIA — Palabra {(disc.wordIdx||0)+1}</p>
                <div className="word-font" style={{fontSize:"1.8rem",textAlign:"center",marginBottom:4}}>{(disc.word||"").toUpperCase()}</div>
                <div className="ph-font" style={{textAlign:"center",marginBottom:12,fontSize:".9rem"}}>{disc.phonetic||""}</div>
                {isPresenter && <p style={{color:"#4B5A78",textAlign:"center"}}>Los jurados están deliberando. El siguiente concursante es: <strong style={{color:"#E8A200"}}>{(gs.contestants?.filter(c=>c.active)||[])[(gs.cIdx||0)+1]?.name||"—"}</strong></p>}
                {!isPresenter && (
                  <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap",marginBottom:10}}>
                    {Object.entries(disc.votes||{}).map(([jid,v])=>{
                      const judgeObj=(gs.judges||[]).find(j=>j.id===jid);
                      const lastName=(judgeObj?.name||jid).split(" ")[1]||(judgeObj?.name||jid);
                      return (
                        <button key={jid} className="btn" onClick={()=>doResolveDiscrepancy(discIdx,v)} style={{
                          flexDirection:"column",gap:2,padding:"9px 14px",
                          background:v==="correct"?"rgba(34,197,94,.15)":"rgba(248,113,113,.15)",
                          color:v==="correct"?"#22c55e":"#f87171",
                          border:"1px solid "+(v==="correct"?"rgba(34,197,94,.4)":"rgba(248,113,113,.4)")}}>
                          <span>{v==="correct"?"✅ Correcta":"❌ Incorrecta"}</span>
                          <span style={{fontSize:".68rem",opacity:.75}}>{lastName}</span>
                          {(()=>{
                          const fv=(disc.votes||{})[jid];
                          const e=fv?.err;
                          if(!e) return null;
                          const RL={no_before:"sin inicio",no_after:"sin final",too_slow:"tardó",discontinuous:"discontinuo"};
                          return(<span style={{fontSize:".65rem",color:"#f59e0b",display:"block",marginTop:2,lineHeight:1.4}}>
                            {e.letter&&<span>letra {e.letter.toUpperCase()} (p.{(e.letterIdx||0)+1})</span>}
                            {e.letter&&e.reason&&<span> · </span>}
                            {e.reason&&<span>{RL[e.reason]||e.reason}</span>}
                          </span>);
                        })()}
                        </button>
                      );
                    })}
                    <button className="btn btn-ghost" style={{flexDirection:"column",gap:2,padding:"9px 12px"}}
                      onClick={()=>{
                        const r=window.prompt("Resultado definitivo (correct / incorrect):");
                        if(r==="correct"||r==="incorrect") doResolveDiscrepancy(discIdx,r);
                      }}>
                      <span>✏️</span><span style={{fontSize:".72rem"}}>Editar</span>
                    </button>
                  </div>
                )}
                <p style={{color:"#4B5A78",fontSize:".72rem",textAlign:"center"}}>{unresolved.length} discrepancia(s) pendiente(s)</p>
              </div>
            );
          })()}

          {/* STAGE END per contestant */}
          {gs.wordPhase==="stage_end" && cur && (
            <div style={{textAlign:"center"}} className="fade-up">
              <p style={{color:"#22c55e",fontWeight:700,fontSize:"1rem",marginBottom:10}}>✅ {cur.name} completó sus palabras</p>
              {isController && (
                <button className="btn btn-gold" style={{padding:"12px 28px"}} onClick={doNextContestant}>
                  {(gs.contestants?.filter(c=>c.active)||[]).length > (gs.cIdx||0)+1 ? "▶ Siguiente Concursante" : "📊 Ver Resultados de Etapa"}
                </button>
              )}
              {!isController&&<p style={{color:"#4B5A78"}}>Esperando a quien dirige el concurso...</p>}
            </div>
          )}

        </div>
      )}
{gs.stageComplete && (
        <div className="card fade-up" style={{marginBottom:14,borderColor:"rgba(232,162,0,.5)"}}>
          <h3 style={{fontFamily:"'Cormorant Garamond',serif",color:"#E8A200",fontSize:"1.4rem",marginBottom:14}}>
            Etapa {cfg?.label} — {gs.stage==="tiebreaker"?"Ronda "+(gs.tbRound+1)+" completada":"Resultados"}
          </h3>

          {/* ── HOST: animated reveal ── */}
          {isController && !isJudge && !gs.advancing.length && (
            <p style={{color:"#4B5A78",fontSize:".84rem",textAlign:"center"}}>⏳ Esperando que los jurados entreguen resultados...</p>
          )}
          {isController && gs.advancing.length>0 && !revealAdvancing && (
            <div style={{textAlign:"center",padding:"20px 0"}}>
              <p style={{color:"#4B5A78",fontSize:".82rem",marginBottom:16}}>
                {gs.stage==="tiebreaker"?"Los jurados han definido el desempate.":"Los jurados entregaron los resultados de esta etapa."}
              </p>
              <button className="btn" onClick={()=>setRevealAdvancing(true)} style={{
                background:"linear-gradient(135deg,#E8A200,#FF7700)",color:"#0C1628",
                padding:"18px 44px",fontSize:"1.1rem",letterSpacing:".08em",borderRadius:16,
                boxShadow:"0 5px 28px rgba(232,162,0,.45)",animation:"pulse 1.5s infinite"
              }}>
                {gs.stage==="tiebreaker"
                  ?(canResolveTop3(ranked)?"🏆 Ver Resultado Final":"➕ Nueva Ronda de Desempate")
                  :"➡️ Ver Siguiente Etapa"}
              </button>
            </div>
          )}
          {isController && gs.advancing.length>0 && revealAdvancing && (
            <div className="fade-up">
              {gs.stage!=="tiebreaker" && (
                <div style={{marginBottom:14}}>
                  <p style={{color:"#22c55e",fontWeight:700,fontSize:".8rem",marginBottom:8,letterSpacing:".04em"}}>
                    ✅ PARTICIPANTES QUE AVANZAN A {nextCfg?.label?.toUpperCase()||"LA SIGUIENTE ETAPA"}
                  </p>
                  {gs.advancing.map(id=>{
                    const c=(Array.isArray(gs?.contestants)?gs.contestants:[]).find(x=>x.id===id);
                    return c?(<div key={id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"rgba(34,197,94,.1)",borderRadius:10,marginBottom:6,border:"1px solid rgba(34,197,94,.25)"}}>
                      <span style={{color:"#22c55e",fontSize:"1.1rem"}}>✅</span>
                      <span style={{color:"#E8EDF8",fontWeight:600}}>{c.name}</span>
                    </div>):null;
                  })}
                  {ranked.filter(c=>!gs.advancing.includes(c.id)).length>0&&(
                    <div style={{marginTop:10}}>
                      <p style={{color:"#ef4444",fontWeight:700,fontSize:".8rem",marginBottom:8,letterSpacing:".04em"}}>❌ ELIMINADOS EN ESTA ETAPA</p>
                      {ranked.filter(c=>!gs.advancing.includes(c.id)).map(c=>(
                        <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",background:"rgba(239,68,68,.07)",borderRadius:10,marginBottom:5,border:"1px solid rgba(239,68,68,.2)"}}>
                          <span style={{color:"#ef4444",fontSize:"1rem"}}>❌</span>
                          <span style={{color:"#6B7FA3"}}>{c.name}</span>
                          <span style={{marginLeft:"auto",color:"#4B5A78",fontSize:".78rem"}}>{c.correct}/{c.total||wpr} correctas</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
              {gs.stage==="tiebreaker" && (
                <div style={{marginBottom:14}}>
                  <p style={{color:"#a78bfa",fontWeight:700,fontSize:".8rem",marginBottom:8}}>⚡ RONDA DE DESEMPATE {gs.tbRound+1}</p>
                  {ranked.map((c,i)=>(
                    <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"rgba(167,139,250,.08)",borderRadius:10,marginBottom:5,border:"1px solid rgba(167,139,250,.2)"}}>
                      <span style={{color:"#a78bfa",minWidth:20,fontWeight:700}}>{i+1}°</span>
                      <span style={{color:"#E8EDF8",fontWeight:600,flex:1}}>{c.name}</span>
                      <span style={{color:"#a78bfa",fontSize:".78rem"}}>{c.correct}/{c.total||1} correctas</span>
                    </div>
                  ))}
                </div>
              )}
              <button className="btn btn-gold" style={{width:"100%"}} onClick={doAdvance}>
                {gs.stage==="tiebreaker"
                  ?(canResolveTop3(ranked)?"🏆 Confirmar y Ver Resultados Finales":"➕ Iniciar Nueva Ronda de Desempate")
                  :"🚀 Iniciar Etapa "+( nextCfg?.label||"Siguiente")}
              </button>
            </div>
          )}

          {/* ── JUDGES: results + tiebreaker controls ── */}
          {isJudge && (
            <div>
              <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
                {ranked.map((c,i)=>(
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:"rgba(255,255,255,.04)",borderRadius:10}}>
                    <span style={{color:"#4B5A78",fontSize:".78rem",width:18,textAlign:"right"}}>{i+1}</span>
                    <span style={{flex:1,fontSize:".88rem"}}>{c.name}</span>
                    <div style={{display:"flex",gap:3}}>{(c.words||[]).slice(0,wpr).map((vv,vi)=><div key={vi} className="dot" style={{background:vv==="correct"?"#22c55e":vv==="incorrect"?"#ef4444":"rgba(255,255,255,.1)"}}/>)}</div>
                    <span style={{fontSize:".84rem",fontWeight:700,minWidth:32,textAlign:"right",color:c.correct>=2?"#22c55e":c.correct===1?"#f59e0b":"#ef4444"}}>{c.correct}/{c.total||wpr}</span>
                  </div>
                ))}
              </div>
              {!gs.advancing.length && (
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {gs.stage==="tiebreaker" ? (
                    <>
                      <p style={{color:"#4B5A78",fontSize:".78rem",textAlign:"center",marginBottom:4}}>
                        Ronda {gs.tbRound+1} completada. ¿Qué desean hacer?
                      </p>
                      <button className="btn" style={{width:"100%",background:"rgba(167,139,250,.18)",color:"#a78bfa",border:"1px solid rgba(167,139,250,.35)"}}
                        onClick={()=>upd(prev=>({...prev,advancing:ranked.map(c=>c.id),tbRound:prev.tbRound}))}>
                        ➕ Agregar otra ronda de desempate
                      </button>
                      <button className="btn btn-gold" style={{width:"100%"}} onClick={doSubmit}>
                        🏆 Finalizar desempate — Entregar al Monitor
                      </button>
                    </>
                  ) : (
                    <button className="btn btn-gold" style={{width:"100%"}} onClick={doSubmit}>
                      📤 Entregar Resultados al Monitor
                    </button>
                  )}
                </div>
              )}
              {gs.advancing.length>0 && !isController && (
                <p style={{color:"#22c55e",fontSize:".84rem",textAlign:"center"}}>✅ Resultados enviados. Esperando a quien dirige...</p>
              )}
            </div>
          )}
        </div>
      )}

      {/* Marcador */}
      <div className="card">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10}}>
          <p style={{color:"#4B5A78",fontSize:".72rem",fontWeight:700,letterSpacing:".06em"}}>
            CONCURSANTES — {cfg?.label?.toUpperCase()}
            {gs.stage==="tiebreaker"&&gs.tbLen&&<span style={{color:stCol,marginLeft:6,textTransform:"none",fontWeight:400,letterSpacing:0}}>· {gs.tbLen} letras</span>}
          </p>
          <span style={{color:"#2D3A55",fontSize:".68rem"}}>{active.length} participante{active.length!==1?"s":""}</span>
        </div>
        {ranked.map((c,i)=>(
          <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
            <span style={{color:"#2D3A55",fontSize:".76rem",width:16,textAlign:"right"}}>{i+1}</span>
            <span style={{flex:1,fontSize:".84rem",color:"#E8EDF8"}}>
              {c.name}
              {cur&&cur?.id===c.id&&!gs.stageComplete&&<span style={{marginLeft:6,fontSize:".64rem",background:stCol+"25",color:stCol,padding:"1px 6px",borderRadius:8}}>activo</span>}
            </span>
            <div style={{display:"flex",gap:3}}>{Array.from({length:wpr}).map((_,wi)=>{const vv=(c.words||[])[wi];return <div key={wi} className="dot" style={{width:9,height:9,background:vv==="correct"?"#22c55e":vv==="incorrect"?"#ef4444":"rgba(255,255,255,.1)"}}/>;})}</div>
            <span style={{fontSize:".8rem",color:"#4B5A78",minWidth:28,textAlign:"right"}}>{c.correct}/{c.total||0}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>

<script>
(function(){
  var _swHost=location.hostname;
  if('serviceWorker' in navigator && !_swHost.includes('claudeusercontent') && _swHost!=='localhost' && _swHost!=='127.0.0.1'){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(function(){});
    });
  }
  var installed=window.matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;
  var dPrompt=null;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); dPrompt=e; if(!sessionStorage.getItem('pwa-no')) showBanner();
  });
  function showBanner(){
    if(installed||document.getElementById('pwa-b')) return;
    var b=document.createElement('div');
    b.id='pwa-b';
    b.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#E8A200;color:#0C1628;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:10px;font-family:system-ui,sans-serif;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.5);white-space:nowrap';
    b.innerHTML='<span style="font-size:18px">🐝</span><span>Instalar como app</span>'
      +'<button onclick="if(window._dp){window._dp.prompt();window._dp.userChoice.then(function(r){if(r.outcome===\'accepted\')document.getElementById(\'pwa-b\').remove();window._dp=null;})}" style="background:#0C1628;color:#E8A200;border:none;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer">Instalar</button>'
      +'<button onclick="document.getElementById(\'pwa-b\').remove();sessionStorage.setItem(\'pwa-no\',1)" style="background:rgba(0,0,0,.15);color:#0C1628;border:none;border-radius:7px;padding:5px 8px;font-size:11px;cursor:pointer">✕</button>';
    document.body.appendChild(b);
    window._dp=dPrompt;
  }
  window.addEventListener('DOMContentLoaded',function(){
    if(installed){
      var badge=document.createElement('span');
      badge.style.cssText='font-size:9px;background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:2px 8px;font-family:system-ui;margin-left:6px';
      badge.textContent='📱 App instalada';
      var hdr=document.querySelector('header');
      if(hdr) hdr.appendChild(badge);
    }
    if(dPrompt&&!sessionStorage.getItem('pwa-no')) setTimeout(showBanner,2500);
  });
  window.addEventListener('appinstalled',function(){
    var b=document.getElementById('pwa-b'); if(b) b.remove();
  });
})();
</script>
</body>
