function fixArrays(data) {
  if(!data||typeof data!=='object') return data;
  function toArr(v){ if(!v) return []; if(Array.isArray(v)) return v; return Object.values(v); }
  if(data.banks){['basic','intermediate','advanced'].forEach(k=>{if(data.banks[k]) data.banks[k]=toArr(data.banks[k]);});}
  if(data.usedWords){['basic','intermediate','advanced'].forEach(k=>{if(data.usedWords[k]) data.usedWords[k]=toArr(data.usedWords[k]);});}

        if(sc?.v) sc.v=toArr(sc.v);

    });
  }
  return data;
}

/* ── PHONETICS (dictionaryapi.dev — 100% gratis, sin clave) ── */
async function getPhonetics(words, onProgress) {
  const map = {};
  for (let i = 0; i < words.length; i += 5) {
    const batch = words.slice(i, i+5);
    await Promise.allSettled(batch.map(async word => {
      try {
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), 5000);
        const res = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word), {signal:ctrl.signal});
        if (res.ok) {
          const d = await res.json();
          const ph = d[0]?.phonetic || d[0]?.phonetics?.find(p=>p?.text)?.text || "";
          if (ph) map[word] = ph;
        }
      } catch {}
    }));
    if (onProgress) onProgress(Math.min(i+5, words.length), words.length);
    if (i+5 < words.length) await new Promise(r => setTimeout(r, 180));
  }
  return map;
}

/* ── DOCUMENT PARSING (Word .docx + PDF + plain text) ── */

/* Parse plain text / paste for word bank */
function parseTextBank(text) {
  const entries=[], seen=new Set();
  for (const rawLine of text.split(/[\r\n]+/)) {
    const line=rawLine.trim(); if(!line)continue;
    let matched=false;
    for (const sep of [" | "," - ","	"]) {
      const idx=line.indexOf(sep);
      if(idx>0){
        const w=line.slice(0,idx).trim().toLowerCase();
        const ph=line.slice(idx+sep.length).trim();
        // Skip document headers (e.g. "BASIC LIST - 2025") and non-word entries
        if(/\b(list|basic|intermediate|advanced|extra|round|macmillan)\b/.test(w)){matched=true;break;}
        if(/^\d{4}/.test(ph)){matched=true;break;}
        if(ph.length>80||(ph.match(/\d/g)||[]).length>ph.length/3){matched=true;break;}
        if(/^[a-z][a-z\s'-]*$/.test(w)&&!seen.has(w)){entries.push({word:w.replace(/\s+/g," "),phonetic:ph});seen.add(w);matched=true;break;}
      }
    }
    if(!matched){
      // Try "123 word" numbered list format or plain word
      const numMatch=line.match(/^\d+\.?\s+(.+)$/);
      const wordPart=numMatch?numMatch[1].trim():line;
      for(const part of wordPart.split(/[,;]+/)){
        const w=part.trim().toLowerCase().replace(/\s+/g," ");
        if(w.length>0&&/^[a-z][a-z\s'-]*$/.test(w)&&!seen.has(w)){entries.push({word:w,phonetic:""});seen.add(w);}
      }
    }
  }
  return entries;
}

/* Parse plain text for contestant names */
function parseTextNames(text) {
  return text.split(/[\r\n]+/).map(l=>l.replace(/^\d+[\.\)\-]\s*/,"").trim()).filter(n=>n.length>1&&n.length<80);
}

/* Parse PDF word bank — handles Macmillan 3-column numbered lists */
async function parsePDFWordBank(file) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = async e => {
      try {
        if(!window.pdfjsLib){ resolve([]); return; }
        const pdf = await pdfjsLib.getDocument({data:e.target.result}).promise;
        let allItems = [];
        for(let p=1; p<=pdf.numPages; p++){
          const page = await pdf.getPage(p);
          const tc   = await page.getTextContent();
          for(const item of tc.items){
            const s=item.str.trim();
            if(s) allItems.push({s, x:item.transform[4], y:item.transform[5]});
          }
        }
        // Sort: top-to-bottom, left-to-right
        allItems.sort((a,b)=>(b.y-a.y)||(a.x-b.x));
        // Group items into rows by Y coordinate (tolerance ±4)
        const rows=[]; let row=[], prevY=null;
        for(const {s,y} of allItems){
          if(prevY===null||Math.abs(y-prevY)<=4){ row.push(s); }
          else { if(row.length) rows.push(row.join(' ').trim()); row=[s]; }
          prevY=y;
        }
        if(row.length) rows.push(row.join(' ').trim());
        // Skip junk rows (headers, footers, year-only)
        const JUNK=/\b(macmillan|spelling bee)\b|^words on|representative of|english language|^\d{4}$|^(basic|intermediate|advanced)\s+list|^extra\s+round/i;
        const cleanRows=rows.filter(r=>r.length>1&&!JUNK.test(r));
        // PRIMARY: global regex finds ALL "number + word(s)" patterns per row
        // Works for 3-col ("1 after 44 doctor 85 king") and 1-col ("1. advertisement")
        const entries=[], seen=new Set();
        const STOP=/^(the|and|of|on|in|at|to|a|is|it|be|as|by|or|an|their|high|sound|most)$/;
        const RE=/\d+\.?\s+([a-zA-Z][a-zA-Z\s\u2011\-']{0,38}?[a-zA-Z])(?=\s+\d+\.?|\s*$)/g;
        for(const row of cleanRows){
          if(JUNK.test(row)) continue;
          RE.lastIndex=0;
          let m;
          while((m=RE.exec(row))!==null){
            const w=m[1].trim().replace(/\s+/g,' ').toLowerCase();
            if(w.length<2||w.length>42||w.split(' ').length>5) continue;
            if(STOP.test(w)||JUNK.test(w)) continue;
            if(!seen.has(w)){ entries.push({word:w,phonetic:''}); seen.add(w); }
          }
        }
        // Fallback: "word | phonetic" custom format
        if(entries.length<5){
          const fb=parseTextBank(cleanRows.join('\n'));
          if(fb.length>entries.length){ resolve(fb); return; }
        }
        // Fallback B: item-by-item (non-numbered PDFs)
        if(entries.length<5){
          const fb2=[],s2=new Set();
          for(const {s} of allItems){
            if(!s||s.length<2||s.length>42) continue;
            if(/^\d+$/.test(s)||!/^[a-zA-Z]/.test(s)) continue;
            if(!/^[a-zA-Z][a-zA-Z\s\-']*$/.test(s)||s.split(/\s+/).length>5) continue;
            if(JUNK.test(s)) continue;
            const w=s.replace(/\s+/g,' ').trim().toLowerCase();
            if(w.length<2||s2.has(w)||STOP.test(w)) continue;
            fb2.push({word:w,phonetic:''}); s2.add(w);
          }
          if(fb2.length>entries.length){ resolve(fb2); return; }
        }
        resolve(entries);
      } catch(err){ resolve([]); }
    };
    fr.readAsArrayBuffer(file);
  });
}

/* ── DOCUMENT PARSING ── */
async function parseWordDoc(file) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = async e => {
      try {
        const {value} = await window.mammoth.extractRawText({arrayBuffer:e.target.result});
        const entries=[], seen=new Set();
        for (const rawLine of value.split(/[\r\n]+/)) {
          const line = rawLine.trim(); if (!line) continue;
          let matched = false;
          for (const sep of [" | "," - ","\t"]) {
            const idx = line.indexOf(sep);
            if (idx>0) {
              const w=line.slice(0,idx).trim().toLowerCase();
              const ph=line.slice(idx+sep.length).trim();
              if (/^[a-z][a-z'-]*$/.test(w)&&!seen.has(w)) { entries.push({word:w,phonetic:ph}); seen.add(w); matched=true; break; }
            }
          }
          if (!matched) {
            for (const part of line.split(",")) {
              const w=part.trim().toLowerCase();
              if (w.length>1&&/^[a-z][a-z'-]*$/.test(w)&&!seen.has(w)) { entries.push({word:w,phonetic:""}); seen.add(w); }
            }
          }
        }
        resolve(entries);
      } catch { resolve([]); }
    };
    fr.readAsArrayBuffer(file);
  });
}

async function parseNamesDoc(file) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = async e => {
      try {
        const {value} = await window.mammoth.extractRawText({arrayBuffer:e.target.result});
        resolve(value.split(/[\r\n]+/).map(l=>l.replace(/^\d+[\.\)\-]\s*/,"").trim()).filter(n=>n.length>1&&n.length<80));
      } catch { resolve([]); }
    };
    fr.readAsArrayBuffer(file);
  });
}

/* ── GAME UTILITIES ── */
function pickWord(bank, used, len) {
  let pool = bank.filter(w=>!used.includes(w.word));
  if (len) pool = pool.filter(w=>w.word.length===len);
  if (!pool.length&&len) pool = bank.filter(w=>!used.includes(w.word));
  if (!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function computeVerdict(j) {
  if (!j) return null;
  // If discrepancy was resolved, use the agreed final
  if (j.phase==="agreed" && j.final) {
    const f=j.final;
    if (f.override!==null&&f.override!==undefined) return f.override;
    if (f.err) return "incorrect";
    if (f.start&&f.end) return "correct";
    return "incorrect";
  }
  // Otherwise use the shared live evaluation
  const s=j.shared||j;
  if (s.override!==null&&s.override!==undefined) return s.override;
  if (s.err) return "incorrect";
  if (s.start&&s.end) return "correct";
  return null;
}
function judgeVoteVerdict(v) {
  if (!v) return null;
  if (v.err) return "incorrect";
  if (v.start&&v.end) return "correct";
  return null;
}
function detectDiscrepancy(j) {
  if (!j?.votes) return false;
  const vArr = Object.values(j.votes);
  if (vArr.length < 2) return false;
  const verdicts = vArr.map(v => judgeVoteVerdict(v));
  return verdicts.some(v => v !== verdicts[0]);
}
function getScore(scores, stage, cId) {
  if (stage==="tiebreaker") {
    const r=scores.tiebreaker?.[cId]?.rounds||[];
    return {correct:r.filter(x=>x==="correct").length,total:r.length,words:r};
  }
  const v=scores[stage]?.[cId]?.v||[];
  return {correct:v.filter(x=>x==="correct").length,total:v.length,words:v};
}
function rankActive(contestants, scores, stage) {
  return contestants.filter(c=>c.active)
    .map(c=>({...c,...getScore(scores,stage,c.id)}))
    .sort((a,b)=>b.correct-a.correct||a.name.localeCompare(b.name));
}
function canResolveTop3(r) {
  if (!r.length) return false;
  if (r.length<=2) return true;
  return r[0].correct!==r[1].correct && r[1].correct!==r[2].correct;
}
function reasonText(reasons, result) {
  if (result==="correct") return "Correcta";
  if (!reasons) return "Incorrecto";
  if (reasons.override==="correct")   return "Correcto por consenso de jurados";
  if (reasons.override==="incorrect") return "Incorrecto por consenso de jurados";
  const issues=[];
  if (!reasons.start) issues.push("No pronunció al inicio");
  if (!reasons.end)   issues.push("No pronunció al final");
  if (reasons.err) issues.push((reasons.err.type==="skipped"?"Omitió":"Deletreó mal")+" la letra «"+reasons.err.letter.toUpperCase()+"»");
  return issues.length ? issues.join("; ") : "Incorrecto";
}

/* ── PDF REPORT v4 — Landscape oficio, 2-section layout ── */
function printReport(gs, role, onDone) {
  const judge = role==="mc" ? gs.mc
    : role==="presenter" ? gs.presenter
    : (gs.judges||[]).find(j=>j.id===role);
  const name = judge?.name || role;
  const roleLabel = role==="mc" ? "Maestro de Ceremonia"
    : role==="presenter" ? "Presentador"
    : "Judge "+role.replace("J","")+", Order "+judge?.order;
  const date = new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  const getC = id => gs.contestants.find(c=>c.id===id);

  /* ── Placement map ── */
  const placeMap = {};
  if (gs.results) {
    if (gs.results.first)  placeMap[gs.results.first]  = { label:"1st Place", emoji:"&#127945;" };
    if (gs.results.second) placeMap[gs.results.second] = { label:"2nd Place", emoji:"&#129352;" };
    if (gs.results.third)  placeMap[gs.results.third]  = { label:"3rd Place", emoji:"&#129353;" };
  }

  const hasTb = gs.history.some(h=>h.stage==="tiebreaker");
  const allC  = gs.contestants||[];

  /* ── Result cell for summary table ── */
  function resCell(cId, stage, slot) {
    const e = gs.history.filter(h=>h.cId===cId&&h.stage===stage)[slot];
    if (!e) return '<td class="rc nd" style="font-size:5.5pt">&ndash;</td>';
    return e.result==="correct"
      ? '<td class="rc ok">&#10003;</td>'
      : '<td class="rc fail">&#10007;</td>';
  }

  /* ── Reason text (English) ── */
  function reasonEn(r, result) {
    if (result==="correct") return "Correct";
    if (!r) return "Incorrect";
    if (r.override==="correct")   return "Correct — judges&rsquo; consensus";
    if (r.override==="incorrect") return "Incorrect — judges&rsquo; consensus";
    const issues=[];
    if (!r.start) issues.push("Did not pronounce the word at the start");
    if (!r.end)   issues.push("Did not pronounce the word at the end");
    if (r.err) issues.push((r.err.type==="skipped"?"Skipped":"Misspelled")
      +" letter &laquo;"+r.err.letter.toUpperCase()+"&raquo;");
    return issues.length ? issues.join("; ") : "Incorrect";
  }

  /* ── Logo ── */
  const logoHTML = gs.logoB64
    ? '<img src="'+gs.logoB64+'" style="position:absolute;top:11mm;left:14mm;width:3cm;height:3cm;object-fit:contain" alt="Logo">'
    : "";
  const logoMiniHTML = gs.logoB64
    ? '<img src="'+gs.logoB64+'" style="width:1.6cm;height:1.6cm;object-fit:contain;vertical-align:middle;margin-right:8px" alt="">'
    : "";
  const padL = gs.logoB64 ? "padding-left:3.6cm" : "";

  /* ── SUMMARY ROWS ── */
  const summaryRows = allC.map((c,i)=>{
    const plc=placeMap[c.id];
    const plcBg=plc
      ?(c.id===gs.results?.first?"background:#fef9c3"
        :c.id===gs.results?.second?"background:#f1f5f9":"background:#fef3e2"):"";
    const plcTxt=plc?plc.emoji+"&#8202;"+plc.label:"&mdash;";
    return '<tr style="'+(i%2?"background:#f9f9f9":"")+'">'
      +'<td class="rc" style="font-weight:700">'+(i+1)+'</td>'
      +'<td class="nm">'+c.name+'</td>'
      +resCell(c.id,"basic",0)+resCell(c.id,"basic",1)+resCell(c.id,"basic",2)
      +resCell(c.id,"intermediate",0)+resCell(c.id,"intermediate",1)+resCell(c.id,"intermediate",2)
      +resCell(c.id,"advanced",0)+resCell(c.id,"advanced",1)+resCell(c.id,"advanced",2)
      +(hasTb?resCell(c.id,"tiebreaker",0)+resCell(c.id,"tiebreaker",1):"")
      +'<td class="place" style="'+plcBg+'">'+plcTxt+'</td>'
      +'</tr>';
  }).join("");

  const tbHdr = hasTb
    ? '<th colspan="2" style="background:#3a1680;border:.5px solid #555;padding:3px 4px;text-align:center">Break the Tie</th>'
    : "";
  const tbSub = hasTb
    ? '<th class="sh">R1</th><th class="sh">R2</th>'
    : "";

  /* ── DETAIL BLOCKS (per student, vertical flow) ── */
  let detailBlocks = "";
  for (const c of allC) {
    const ents = gs.history.filter(h=>h.cId===c.id);
    // Always include ALL contestants, even those with no words recorded
    const plc=placeMap[c.id];
    const cor=ents.filter(e=>e.result==="correct").length;

const ADMIN_PATH   = "spellingbee/admin";
const ROOMS_PATH   = "spellingbee/rooms";
const DEFAULT_PWD  = "jd-reset-2025";    // contraseña por defecto al crear/resetear

/* Hashing SHA-256 con Web Crypto */
async function hashPwd(pwd) {
  const data = new TextEncoder().encode(pwd + ":jd-sb-salt");
  const buf  = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* Contar salas activas de un usuario */
async function countActiveRooms(username) {
  const snap = await window.rtdb.ref(ROOMS_PATH).once("value");
  const rooms = snap.val()||{};
  return Object.values(rooms).filter(r=>r.state?.createdBy===username&&r.state?.phase!=="archived").length;
}

/* Cargar todos los usuarios operadores */
async function loadAdminUsers() {
  const snap = await window.rtdb.ref(ADMIN_PATH+"/users").once("value");
  const data = snap.val()||{};
  // Enrich with active room count
  const enriched = await Promise.all(Object.entries(data).map(async([username,u])=>{
    const active = await countActiveRooms(username);
    return {...u, username, activeRooms:active};
  }));
  return enriched;
}

/* Crear usuario operador */
async function createAdminUser(username, roomLimit, createdBy) {
  const pwdHash = await hashPwd(DEFAULT_PWD);
  const user = { passwordHash:pwdHash, roomLimit:roomLimit||6, active:true,
    createdAt:Date.now(), createdBy:createdBy||'master', totalCreated:0 };
  await window.rtdb.ref(ADMIN_PATH+"/users/"+username).set(user);
}

/* Resetear contraseña a default */
async function resetAdminUserPwd(username) {
  const hash = await hashPwd(DEFAULT_PWD);
  await window.rtdb.ref(ADMIN_PATH+"/users/"+username+"/passwordHash").set(hash);
}

/* Cambiar límite de salas */
async function setRoomLimit(username, limit) {
  await window.rtdb.ref(ADMIN_PATH+"/users/"+username+"/roomLimit").set(limit);
}

/* Desactivar usuario */
async function toggleAdminUser(username, active) {
  await window.rtdb.ref(ADMIN_PATH+"/users/"+username+"/active").set(active);
}

/* Login de operador */
async function loginOperator(username, password) {
  // Check if it's master
  const masterLogin = await loginMaster(username, password);
  if (masterLogin.ok) return {ok:true, user:{type:"master", username}};
  // Check operator
  const snap = await window.rtdb.ref(ADMIN_PATH+"/users/"+username).once("value");
  const u = snap.val();
  if (!u||!u.active) return {ok:false, err:"Usuario no encontrado o desactivado"};
  const hash = await hashPwd(password);
  if (hash !== u.passwordHash) return {ok:false, err:"Contraseña incorrecta"};
  const active = await countActiveRooms(username);
  return {ok:true, user:{type:"operator",username,roomLimit:u.roomLimit||6,activeRooms:active}};
}

/* Seed master user on first load */
async function ensureMasterExists() {
  const snap = await window.rtdb.ref(ADMIN_PATH+"/master").once("value");
  if (!snap.val()) {
    await window.rtdb.ref(ADMIN_PATH+"/master").set({
      username:"dportillo",
      passwordHash:"cd4de9b2e93337282a109a4b1519e25d106517bde46cccc07ff06920ec8bbc9a",
      createdAt:Date.now()
    });
  }
}

/* Login master with username/password */
async function loginMaster(username, password) {
  const snap = await window.rtdb.ref(ADMIN_PATH+"/master").once("value");
  const m = snap.val();
  if (!m || m.username !== username) return {ok:false, err:"Usuario maestro no encontrado"};
  const hash = await hashPwd(password);
  if (hash !== m.passwordHash) return {ok:false, err:"Contraseña incorrecta"};
  return {ok:true};
}

/* Error boundary — prevents full blue-screen crash */
class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return{err};}
  componentDidCatch(err,info){console.error("AppError:",err,info);}
  render(){
    if(this.state.err) return React.createElement("div",
      {style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#0C1628",color:"#E8EDF8",gap:16,padding:24,fontFamily:"sans-serif"}},
      React.createElement("div",{style:{fontSize:"3rem"}},"🐝"),
      React.createElement("h2",{style:{color:"#E8A200",marginBottom:8}},"Ocurrió un error"),
      React.createElement("p",{style:{color:"#4B5A78",fontSize:".9rem",maxWidth:400,textAlign:"center"}},String(this.state.err?.message||"Error inesperado")),
      React.createElement("button",{style:{padding:"10px 24px",background:"#E8A200",color:"#0C1628",border:"none",borderRadius:10,fontWeight:700,cursor:"pointer",fontSize:"1rem"},
        onClick:()=>window.location.reload()},"🔄 Recargar página")
    );
    return this.props.children;
  }
}

      /* Firebase still initializing — wait for it */
      const waitAndCheck = () => {
        if (window.FIREBASE_OK) {

          setTimeout(waitAndCheck, 80);
        }
      };
      waitAndCheck();
      return;
    }
    setScreen("checking");
    window.rtdb.ref("spellingbee/rooms/"+room+"/state").once("value").then(snap => {
      const s = fixArrays(snap.val());
      if (!s) { setScreen("room-not-found"); return; }
      if (s.phase==="archived") { setScreen("room-closed"); return; }
      // Auto-expire after 72 hours of inactivity
      const last = s.lastActivity || s.expiresAt - 72*3600*1000 || 0;
      // 36h after all actas downloaded
      const actaExpired = s.actasClosedAt && (Date.now()-s.actasClosedAt > 36*3600*1000);
      // 72h inactivity
      const expired = actaExpired || (s.expiresAt ? Date.now()>s.expiresAt : (Date.now()-last>72*3600*1000));
      if (expired) {
        window.rtdb.ref("spellingbee/rooms/"+room+"/state/phase").set("archived");
        setScreen("room-closed"); return;
      }
      setGs(s); setScreen("login");
    }).catch(() => setScreen("room-not-found"));

      const data = fixArrays(raw);
      setGs(prev => JSON.stringify(prev)===JSON.stringify(data) ? prev : data);
      const sc = screenRef.current;
      if (data.phase==="competition" && (sc==="setup"||sc==="setup-wait")) setScreen("competition");

  /* ══════════════════════════════════════════
     NEW WORD-BY-WORD FLOW HANDLERS

  /* All judges pressed "Listo" — pre-draw 3 words */
  const doJudgeReady = useCallback(() => {
    const s=gsRef.current; if(!s) return;
    upd(prev=>{
      const newReady={...prev.judgesReady,[role]:true};
      const numJudges=(prev.judges||[]).length||prev.judgeCount||3;
      const allReady=Object.keys(newReady).length>=numJudges;
      if(!allReady) return {...prev,judgesReady:newReady};
      // Draw 3 words for current contestant
      const cfg=STAGES[prev.stage];
      const used=[...prev.usedWords[cfg.bank]];
      const drawn=[];
      const pool=prev.banks[cfg.bank].filter(w=>!used.includes(w.word));
      for(let i=0;i<3&&pool.length>0;i++){
        const idx=Math.floor(Math.random()*pool.length);
        drawn.push(pool[idx]);
        pool.splice(idx,1);
      }
      const newUsed=[...used,...drawn.map(w=>w.word)];
      return {...prev,judgesReady:newReady,currentWords:drawn,currentWordIdx:0,
        wordJudgments:{},wordPhase:"word_show",
        usedWords:{...prev.usedWords,[cfg.bank]:newUsed}};
    });
  },[role]);

  /* Judge submits verdict for current word */
  const doJudgeWordVerdict = useCallback((verdict, errInfo) => {
    const s=gsRef.current; if(!s) return;
    const wi=s.currentWordIdx;
    upd(prev=>{
      const prevWJ=prev.wordJudgments||{};
      const prevWord=prevWJ[wi]||{};
      const myVote={verdict, err:errInfo||null, ts:Date.now()};
      const updWord={...prevWord,[role]:myVote};
      const newWJ={...prevWJ,[wi]:updWord};
      const numJudges=(prev.judges||[]).length||prev.judgeCount||3;
      const allVoted=Object.keys(updWord).length>=numJudges;
      if(!allVoted) return {...prev,wordJudgments:newWJ};
      // All judges voted — check discrepancies
      const votes=Object.values(updWord);
      const verdicts=votes.map(v=>v.verdict);
      const hasDisc=verdicts.some(v=>v!==verdicts[0]);
      const word=prev.currentWords[wi];
      // Record to history if all agree
      if(!hasDisc){
        const finalV=verdicts[0];
        const active=prev.contestants.filter(c=>c.active);
        const cur=active[prev.cIdx];
        const hEntry={stage:prev.stage,stageLabel:STAGES[prev.stage].label,
          cId:cur?.id,cName:cur?.name,word:word?.word||"",phonetic:word?.phonetic||"",
          result:finalV,reasons:{override:null,err:errInfo,start:true,end:true}};
        const ns={...prev.scores};
        const pv=ns[prev.stage]?.[cur?.id]?.v||[];
        const nv=[...pv]; nv[wi]=finalV;
        ns[prev.stage]={...ns[prev.stage],[cur?.id]:{v:nv}};
        // Move to next word or stage_end
        const nextWi=wi+1;
        const isLast=nextWi>=prev.currentWords.length;
        return {...prev,wordJudgments:newWJ,
          history:[...prev.history,hEntry],scores:ns,
          wordPhase:isLast?"stage_end":"word_show",
          currentWordIdx:isLast?wi:nextWi,
          judgesReady:isLast?{}:prev.judgesReady};
      }
      // Has discrepancy — add to list
      const disc={wordIdx:wi,word:word?.word,phonetic:word?.phonetic,
        votes:Object.fromEntries(Object.entries(updWord).map(([jid,v])=>[jid,v.verdict])),
        resolved:false,final:null};
      return {...prev,wordJudgments:newWJ,
        discrepancies:[...prev.discrepancies,disc],
        wordPhase:"deliberation"};
    });
  },[role]);

  /* Resolve discrepancy — pick one judge's verdict or custom */
  const doResolveDiscrepancy = useCallback((discIdx, finalVerdict) => {
    const s=gsRef.current; if(!s) return;
    upd(prev=>{
      const discs=[...prev.discrepancies];
      discs[discIdx]={...discs[discIdx],resolved:true,final:finalVerdict};
      const allResolved=discs.every(d=>d.resolved);
      if(!allResolved) return {...prev,discrepancies:discs};
      // All resolved — write to history and scores
      const active=prev.contestants.filter(c=>c.active);
      const cur=active[prev.cIdx];
      let newHistory=[...prev.history];
      const ns={...prev.scores};
      for(const d of discs){
        const hEntry={stage:prev.stage,stageLabel:STAGES[prev.stage].label,
          cId:cur?.id,cName:cur?.name,
          word:d.word||"",phonetic:d.phonetic||"",
          result:d.final,reasons:{override:d.final,err:null,start:true,end:true}};

        ns[prev.stage]={...ns[prev.stage],[cur?.id]:{v:nv}};
      }
      // Also add non-discrepancy words already in wordJudgments
      return {...prev,discrepancies:discs,history:newHistory,scores:ns,

  const doFlagDispute = () => {

  const doResolveDispute = (result, key) => {
    upd(prev=>{
      const dw={...prev.disputedWords};
      if(dw[key]){dw[key]={...dw[key],resolved:true,finalResult:result};}
      // Also update history if that word was already recorded
      const h=[...prev.history];
      const hIdx=h.findIndex(x=>x.stage===prev.stage&&x.cId===dw[key]?.cId&&x.word===dw[key]?.word);
      if(hIdx>=0){h[hIdx]={...h[hIdx],result,reasons:{...(h[hIdx].reasons),override:result}};}
      // Update scores too
      const ns={...prev.scores};
      if(prev.stage!=="tiebreaker"&&dw[key]){
        const cId=dw[key].cId, slot=dw[key].slot;
        const pv=ns[prev.stage]?.[cId]?.v||[];
        const nv=[...pv]; nv[slot]=result;
        ns[prev.stage]={...ns[prev.stage],[cId]:{v:nv}};
      }
      return {...prev, disputedWords:dw, history:h, scores:ns};
    });
  };
  const doLogoUpload = (file) => {
    if (!file) return;
    const fr=new FileReader();
    fr.onload=e=>{ setLogoB64(e.target.result); window._logoB64=e.target.result; };
    fr.readAsDataURL(file);

  const doNext = () => {
    const s=gsRef.current; if(!s) return;
    const active=s.contestants.filter(c=>c.active);
    const cur=active[s.cIdx]; if(!cur) return;
    const cfg=STAGES[s.stage];
    const v=computeVerdict(s.judgment)||"incorrect";
    let ns={...s.scores};
    if (s.stage==="tiebreaker") {
      const pr=s.scores.tiebreaker?.[cur.id]?.rounds||[];
      ns.tiebreaker={...s.scores.tiebreaker,[cur.id]:{rounds:[...pr,v]}};
    } else {
      const pv=s.scores[s.stage]?.[cur.id]?.v||[];
      const nv=[...pv]; nv[s.slot]=v;
      ns[s.stage]={...s.scores[s.stage],[cur.id]:{v:nv}};
    }
    const hEntry={
      stage:s.stage, stageLabel:cfg.label,
      cId:cur.id, cName:cur.name,
      word:s.activeWord?.word||"", phonetic:s.activeWord?.phonetic||"",
      result:v,
      reasons:{start:(s.judgment?.final||s.judgment?.shared||s.judgment)?.start,end:(s.judgment?.final||s.judgment?.shared||s.judgment)?.end,err:(s.judgment?.final||s.judgment?.shared||s.judgment)?.err,override:(s.judgment?.final||s.judgment?.shared||s.judgment)?.override},

    const nextSlot=s.slot+1;
    if (nextSlot<cfg.wpr) {
      upd(prev=>({...prev,scores:ns,history:[...prev.history,hEntry],activeWord:null,judgment:null,slot:nextSlot}));
    } else {
      const nextIdx=s.cIdx+1;
      if (nextIdx>=active.length) {
        upd(prev=>({...prev,scores:ns,history:[...prev.history,hEntry],activeWord:null,judgment:null,cIdx:0,slot:0,stageComplete:true}));
      } else {
        upd(prev=>({...prev,scores:ns,history:[...prev.history,hEntry],activeWord:null,judgment:null,cIdx:nextIdx,slot:0}));
      }
    }
  };

  const doSubmit = () => {
    const s=gsRef.current; if(!s) return;
    const ranked=rankActive(s.contestants.filter(c=>c.active),s.scores,s.stage);
    let advIds = s.stage==="tiebreaker" ? ranked.map(c=>c.id) : ranked.filter(c=>c.correct>=2).map(c=>c.id);
    if (advIds.length<2 && ranked.length>=2) advIds=ranked.slice(0,2).map(c=>c.id);
    if (!advIds.length) advIds=ranked.slice(0,1).map(c=>c.id);
    upd(prev=>({...prev,advancing:advIds}));
  };

  const doAdvance = () => {
    const s=gsRef.current; if(!s) return;
    const ranked=rankActive(s.contestants.filter(c=>s.advancing.includes(c.id)),s.scores,s.stage);
    const r3=canResolveTop3(ranked);
    if (s.stage==="tiebreaker") {
      if (r3) {
        upd(prev=>({...prev,phase:"results",results:{first:ranked[0]?.id||null,second:ranked[1]?.id||null,third:ranked[2]?.id||null}}));
        setScreen("results");
      } else {
        upd(prev=>({...prev,cIdx:0,slot:0,activeWord:null,judgment:null,stageComplete:false,advancing:[],tbRound:prev.tbRound+1}));
      }
      return;
    }
    if (s.stage==="advanced" && (r3||ranked.length<=2)) {
      upd(prev=>({...prev,phase:"results",results:{first:ranked[0]?.id||null,second:ranked[1]?.id||null,third:ranked[2]?.id||null}}));
      setScreen("results"); return;
    }
    const next=STAGES[s.stage]?.next; if(!next) return;
    upd(prev=>({
      ...prev, stage:next,
      contestants:prev.contestants.map(c=>({...c,active:s.advancing.includes(c.id)})),
      cIdx:0,slot:0,activeWord:null,judgment:null,stageComplete:false,advancing:[],tbLen:null,tbRound:0,
    }));
  };

  const doPrintAndConfirm = () => {
    printReport(gsRef.current, role, () => {
      upd(prev=>{
        const confirmed={...prev.pdfConfirmed,[role]:true};
        const totalJudges=Math.max((prev.judges||[]).length,1);
        const judgesConfirmed=(prev.judges||[]).filter(j=>confirmed[j.id]).length;
        const allDone=judgesConfirmed>0&&judgesConfirmed>=totalJudges;
        // Set actasClosedAt timestamp — room archives 36h later
        const actasClosedAt=allDone&&!prev.actasClosedAt?Date.now():prev.actasClosedAt;
        return {...prev,pdfConfirmed:confirmed,actasClosedAt};
      });
    });
  };

  /* Configurator can print ANY judge's acta */
  const doPrintJudgeActa = (judgeId) => {
    const s=gsRef.current; if(!s) return;
    printReport(s, judgeId, null);
  };

  const doArchive = () => {
    if (!confirm("¿Cerrar definitivamente esta sala? Los nuevos visitantes ya no podrán unirse.")) return;
    upd(prev=>({...prev,phase:"archived"}));
  };

  /* ── DERIVED ── */
  const isMC        = role==="mc";
  const isPresenter = role==="presenter";
  const isJudge     = role && ["J1","J2","J3","J4"].includes(role);
  const isCreator   = !!sessionStorage.getItem("creator-"+roomId);
  const myJudge     = (gs?.judges||[]).find(j=>j.id===role);
  const numJudges   = gs?.judgeCount||3;
  const allJudgesReady = (gs?.judges||[]).length>=numJudges && 
    (gs?.judges||[]).every(j=>(gs?.judgesReady||{})[j.id]);
  const active=gs?.contestants?.filter(c=>c.active)||[];
  const cur=active[gs?.cIdx??0];
  const j=gs?.judgment, aw=gs?.activeWord;
  const cfg=gs?.stage&&STAGES[gs.stage]?STAGES[gs.stage]:null;
  const stCol=cfg?.color||"#E8A200", wpr=cfg?.wpr??3;
  const ranked=gs?rankActive(active,gs.scores,gs.stage):[];
  const verdict=computeVerdict(j);
  const wColor=verdict==="correct"?"#22c55e":verdict==="incorrect"||j?.err?"#ef4444":"#22c55e";
  const nextCfg=cfg?.next?STAGES[cfg.next]:null;
  const shareUrl=roomId?getShareUrl(roomId):"";
  const qrUrl=roomId?"https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+encodeURIComponent(shareUrl)+"&color=E8EDF8&bgcolor=162038":"";
  const confirmedCount=(gs?.judges||[]).filter(j=>gs?.pdfConfirmed?.[j.id]).length;
  const judgeCount=Math.max((gs?.judges||[]).length,1);

  /* ── DISPUTE MODAL ── */
  const pendingDisputes = Object.entries(gs?.disputedWords||{}).filter(([k,d])=>!d.resolved);
  const DisputeModal = disputeModal && pendingDisputes.length>0 && (
    <div className="overlay" onClick={()=>setDisputeModal(false)}>
      <div className="card" style={{width:"100%",maxWidth:500,display:"flex",flexDirection:"column",gap:12,maxHeight:"80vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.4rem",color:"#fbbf24"}}>⚠️ Discrepancias Pendientes</h3>
        <p style={{color:"#6B7FA3",fontSize:".8rem"}}>Los siguientes casos requieren deliberación. Seleccionen el resultado acordado:</p>
        {pendingDisputes.map(([key,d])=>(
          <div key={key} style={{background:"rgba(251,191,36,.08)",border:"1px solid rgba(251,191,36,.25)",borderRadius:10,padding:12}}>
            <p style={{color:"#E8EDF8",fontWeight:700,fontSize:".9rem",marginBottom:2}}>{d.word?.toUpperCase()}</p>
            <p style={{color:"#6B7FA3",fontSize:".78rem",marginBottom:4}}>{d.cName} · Etapa {STAGES[d.stage]?.label} · Palabra {(d.slot||0)+1}</p>
            <p style={{color:"#fbbf24",fontSize:".74rem",marginBottom:10}}>⚠ {d.description}</p>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-green" style={{flex:1,padding:10,fontSize:".84rem"}} onClick={()=>{doResolveDispute("correct",key);}}>✅ Correcto</button>
              <button className="btn btn-red"   style={{flex:1,padding:10,fontSize:".84rem"}} onClick={()=>{doResolveDispute("incorrect",key);}}>❌ Incorrecto</button>
            </div>
          </div>
        ))}
        <button className="btn btn-ghost" onClick={()=>setDisputeModal(false)}>Cerrar</button>
      </div>
    </div>
  );

  /* ── MODALS ── */
  const LtrModal = ltrModal && (
    <div className="overlay" onClick={()=>setLtrModal(null)}>
      <div className="card" style={{width:"100%",maxWidth:300,display:"flex",flexDirection:"column",gap:10}} onClick={e=>e.stopPropagation()}>
        <h3 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.5rem"}}>
          Error en «<span style={{color:"#E8A200"}}>{ltrModal.letter.toUpperCase()}</span>»
        </h3>
        <p style={{color:"#6B7FA3",fontSize:".82rem"}}>¿Qué error cometió el concursante?</p>
        <button className="btn" style={{background:"rgba(251,191,36,.15)",color:"#fbbf24",border:"1px solid rgba(251,191,36,.3)",padding:13,width:"100%"}} onClick={()=>doMarkErr("skipped")}>⚡ La omitió / se la saltó</button>
        <button className="btn" style={{background:"rgba(248,113,113,.15)",color:"#f87171",border:"1px solid rgba(248,113,113,.3)",padding:13,width:"100%"}} onClick={()=>doMarkErr("misspelled")}>❌ La deletreó incorrectamente</button>
        <button className="btn btn-ghost" onClick={()=>setLtrModal(null)}>Cancelar</button>
      </div>
    </div>
  );

  const OvrModal = ovrModal && (
    <div className="overlay" onClick={()=>setOvrModal(false)}>
      <div className="card" style={{width:"100%",maxWidth:300,display:"flex",flexDirection:"column",gap:10}} onClick={e=>e.stopPropagation()}>
        <h3 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.5rem"}}>✏️ Corrección por Consenso</h3>
        <p style={{color:"#6B7FA3",fontSize:".82rem"}}>Resultado acordado por los jurados:</p>
        <button className="btn btn-green" style={{padding:13,width:"100%"}} onClick={()=>doOverride("correct")}>✅ Correcto</button>
        <button className="btn btn-red"   style={{padding:13,width:"100%"}} onClick={()=>doOverride("incorrect")}>❌ Incorrecto</button>
        {j?.override!=null && <button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>doOverride(null)}>🗑 Quitar corrección</button>}
        <button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>setOvrModal(false)}>Cancelar</button>
      </div>
    </div>
  );

  /* ══════════════════════════════════════
     SCREENS
  ══════════════════════════════════════ */

  /* INIT spinner */
  /* ── ADMIN MODAL OVERLAY ── */
  const AdminModal = showAdmin && (
    <div className="overlay" style={{zIndex:500,alignItems:"flex-start",paddingTop:40}} onClick={()=>setShowAdmin(false)}>

          <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:".76rem"}} onClick={()=>setShowAdmin(false)}>✕</button>

        {/* ── LOGIN VIEW ── */}
        {adminView==="login" && (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>

        {/* ── DASHBOARD VIEW (master only) ── */}
        {adminView==="dashboard" && (adminUser?.type==="master") && (
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{padding:"8px 12px",background:"rgba(232,162,0,.1)",border:"1px solid rgba(232,162,0,.25)",borderRadius:10}}>
              <p style={{color:"#E8A200",fontSize:".78rem",fontWeight:700}}>👑 Maestro: {adminUser.email}</p>
            </div>

            {/* Create new user */}
            <div style={{borderBottom:"1px solid rgba(255,255,255,.08)",paddingBottom:14}}>
              <p style={{color:"#6B7FA3",fontSize:".72rem",fontWeight:700,letterSpacing:".05em",marginBottom:10}}>➕ CREAR USUARIO OPERADOR</p>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <input className="field" placeholder="Nombre de usuario (sin espacios)" value={newUserForm.username}
                  onChange={e=>setNewUserForm(p=>({...p,username:e.target.value.replace(/\s/g,"")}))} style={{flex:2,fontSize:".85rem"}}/>
                <div style={{flex:1,display:"flex",flexDirection:"column",gap:3}}>
                  <label style={{color:"#4B5A78",fontSize:".65rem"}}>Límite de salas</label>
                  <input className="field" type="number" min={1} max={50} value={newUserForm.limit}
                    onChange={e=>setNewUserForm(p=>({...p,limit:+e.target.value}))} style={{textAlign:"center"}}/>
                </div>
              </div>
              <p style={{color:"#2D3A55",fontSize:".72rem",marginBottom:8}}>Contraseña inicial: <code style={{color:"#a78bfa",background:"rgba(167,139,250,.1)",padding:"1px 6px",borderRadius:4}}>{DEFAULT_PWD}</code></p>
              <button className="btn btn-gold" style={{width:"100%"}} disabled={adminBusy||!newUserForm.username.trim()} onClick={doCreateAdminUser}>
                {adminBusy?"Creando...":"Crear Usuario"}
              </button>
              {adminStatus && <p style={{color:adminStatus.startsWith("✅")?"#22c55e":"#f87171",fontSize:".8rem",marginTop:6}}>{adminStatus}</p>}
            </div>

            {/* User list */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <p style={{color:"#6B7FA3",fontSize:".72rem",fontWeight:700,letterSpacing:".05em"}}>👥 USUARIOS REGISTRADOS ({adminUsers.length})</p>
              <button className="btn btn-ghost" style={{padding:"3px 10px",fontSize:".68rem"}} onClick={doRefreshUsers}>{adminBusy?"⏳":"🔄 Actualizar"}</button>
            </div>
            {adminUsers.length===0&&<p style={{color:"#2D3A55",fontSize:".8rem",textAlign:"center"}}>No hay usuarios creados aún</p>}
            {adminUsers.map(u=>(
              <div key={u.username} style={{background:"rgba(255,255,255,.04)",borderRadius:10,padding:"10px 13px",border:"1px solid rgba(255,255,255,.07)"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
                  <span style={{fontWeight:700,color:u.active?"#E8EDF8":"#3B4B6A",flex:1}}>{u.username}</span>
                  <span style={{fontSize:".72rem",padding:"2px 8px",borderRadius:10,background:u.active?"rgba(34,197,94,.15)":"rgba(239,68,68,.1)",color:u.active?"#22c55e":"#f87171",border:"1px solid "+(u.active?"rgba(34,197,94,.3)":"rgba(239,68,68,.25)")}}>
                    {u.active?"Activo":"Desactivado"}
                  </span>
                  <span style={{fontSize:".72rem",color:"#4B5A78"}}>
                    {u.activeRooms}/{u.roomLimit} salas
                  </span>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:".72rem",color:"#f59e0b",borderColor:"rgba(245,158,11,.3)"}}
                    onClick={()=>doResetPwd(u.username)}>🔑 Resetear contraseña</button>
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <span style={{color:"#4B5A78",fontSize:".72rem"}}>Límite:</span>
                    <input type="number" min={1} max={50} defaultValue={u.roomLimit}
                      onBlur={e=>doSetLimit(u.username,e.target.value)}
                      style={{width:46,background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,padding:"3px 5px",color:"#E8EDF8",fontSize:".78rem",textAlign:"center"}}/>
                  </div>
                  <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:".72rem",color:u.active?"#ef4444":"#22c55e",borderColor:u.active?"rgba(239,68,68,.3)":"rgba(34,197,94,.3)"}}
                    onClick={()=>doToggleUser(u.username,!u.active)}>
                    {u.active?"⛔ Desactivar":"✅ Activar"}
                  </button>
                </div>
                <p style={{color:"#2D3A55",fontSize:".68rem",marginTop:5}}>
                  Creado: {new Date(u.createdAt).toLocaleDateString("es-SV")}
                </p>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );

  if (screen==="init") return (
    <div className="sb" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <style>{CSS}</style>
      <p className="pulse" style={{color:"#4B5A78"}}>Iniciando...</p>
    </div>
  );

  /* FIREBASE ERROR */
  if (screen==="firebase-error") return (
    <div className="sb" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:20}}>
      <style>{CSS}</style>
      <div className="card" style={{maxWidth:500,width:"100%",textAlign:"center",gap:14,display:"flex",flexDirection:"column"}}>
        <div className="pulse" style={{fontSize:"3rem"}}>🐝</div>
        <h2 style={{fontFamily:"'Cormorant Garamond',serif",color:"#E8A200",fontSize:"1.6rem"}}>Conectando con Firebase...</h2>
        <p style={{color:"#6B7FA3",fontSize:".88rem",lineHeight:1.7}}>
          Si este mensaje no desaparece en 10 segundos, verifica tu conexión a internet o que Firebase esté habilitado en el archivo <code style={{background:"rgba(255,255,255,.1)",padding:"2px 6px",borderRadius:4}}>index.html</code>.
        </p>
        <button className="btn btn-ghost" style={{alignSelf:"center"}} onClick={()=>window.location.reload()}>🔄 Recargar página</button>
      </div>
    </div>
  );

  /* CHECKING */
  if (screen==="checking") return (
    <div className="sb" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:16}}>
      <style>{CSS}</style>
      <div className="pulse" style={{fontSize:"3rem"}}>🐝</div>
      <p style={{color:"#4B5A78"}}>Verificando sala {roomId}...</p>
    </div>
  );

  /* ROOM NOT FOUND */
  if (screen==="room-not-found") return (
    <div className="sb" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:20}}>
      <style>{CSS}</style>
      <div className="card" style={{maxWidth:420,width:"100%",textAlign:"center"}}>
        <div style={{fontSize:"3rem",marginBottom:12}}>🔍</div>
        <h2 style={{fontFamily:"'Cormorant Garamond',serif",color:"#ef4444",fontSize:"1.8rem",marginBottom:10}}>Sala no encontrada</h2>
        <p style={{color:"#6B7FA3",marginBottom:20}}>El código <code style={{background:"rgba(255,255,255,.08)",padding:"2px 8px",borderRadius:6,color:"#E8EDF8"}}>{roomId}</code> no existe o el enlace expiró.</p>
        <button className="btn btn-ghost" onClick={()=>{window.history.pushState({},"",window.location.pathname);setScreen("landing");}}>← Volver</button>
      </div>
    </div>
  );

  /* ROOM CLOSED */
  if (screen==="room-closed") return (
    <div className="sb" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:20}}>
      <style>{CSS}</style>
      <div className="card" style={{maxWidth:420,width:"100%",textAlign:"center"}}>
        <div style={{fontSize:"3rem",marginBottom:12}}>🔒</div>
        <h2 style={{fontFamily:"'Cormorant Garamond',serif",color:"#a78bfa",fontSize:"1.8rem",marginBottom:10}}>Concurso finalizado</h2>
        <p style={{color:"#6B7FA3",marginBottom:16}}>La sala <strong style={{color:"#E8EDF8"}}>{roomId}</strong> ya cerró. Las actas fueron generadas o la sala expiró después de 72 horas de inactividad.</p>
        <button className="btn btn-ghost" onClick={()=>{window.history.pushState({},"",window.location.pathname);setScreen("landing");}}>← Crear un nuevo concurso</button>
      </div>
    </div>
  );

  /* LANDING */
  if (screen==="landing") return (
    <div className="sb" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:24,gap:28}}>
      <style>{CSS}</style>
      {AdminModal}
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:"3.5rem",lineHeight:1.1,marginBottom:6}}>🐝</div>
        <h1 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"3rem",fontWeight:700,color:"#E8A200",lineHeight:1}}>Spelling Bee</h1>
        <p style={{color:"#4B5A78",marginTop:5,fontSize:".85rem"}}>Sistema Multi-sala · Tiempo real · Actas PDF</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,width:"100%",maxWidth:560}}>
        <div className="card" style={{display:"flex",flexDirection:"column",gap:12,borderColor:"rgba(232,162,0,.35)"}}>
          <p style={{color:"#E8A200",fontWeight:700,fontSize:".76rem",letterSpacing:".06em"}}>🆕 CREAR CONCURSO</p>
          <p style={{color:"#4B5A78",fontSize:".78rem",lineHeight:1.5}}>Genera una sala única con enlace y QR para compartir con los jurados</p>
          <input className="field" placeholder="Nombre de la institución *" value={inst} onChange={e=>setInst(e.target.value)} style={{fontSize:".84rem"}}/>
          <input className="field" placeholder="Grado / Nivel (opcional)" value={lvl} onChange={e=>setLvl(e.target.value)} style={{fontSize:".84rem"}}/>
          <button className="btn btn-gold" disabled={!inst.trim()||!window.FIREBASE_OK} onClick={doCreateRoom} style={{width:"100%"}}>Generar Sala →</button>
        </div>
        <div className="card" style={{display:"flex",flexDirection:"column",gap:12}}>
          <p style={{color:"#E8A200",fontWeight:700,fontSize:".76rem",letterSpacing:".06em"}}>🔗 UNIRSE A SALA</p>
          <p style={{color:"#4B5A78",fontSize:".78rem",lineHeight:1.5}}>Escribe el código de sala que te compartió el configurador del concurso</p>
          <input className="field" placeholder="Código (ej: UNAB-K7X2)" value={joinCode} onChange={e=>setJoinCode(e.target.value.toUpperCase())} onKeyDown={e=>e.key==="Enter"&&doJoinByCode()} style={{fontSize:".84rem",letterSpacing:".06em"}}/>
          <button className="btn btn-ghost" disabled={!joinCode.trim()} onClick={doJoinByCode} style={{width:"100%"}}>Entrar →</button>

        </div>
      </div>
      {!window.FIREBASE_OK && (
        <div style={{maxWidth:560,width:"100%",padding:"10px 14px",background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:10,color:"#f87171",fontSize:".82rem"}}>

            <div style={{display:"flex",gap:6,marginBottom:10}}>

              <button className="btn btn-ghost" style={{flex:1,padding:"7px 10px",fontSize:".76rem",background:pasteMode.pax?"rgba(232,162,0,.15)":"rgba(255,255,255,.05)",color:pasteMode.pax?"#E8A200":"#4B5A78",borderColor:pasteMode.pax?"rgba(232,162,0,.35)":"rgba(255,255,255,.1)"}} onClick={()=>setPasteMode(p=>({...p,pax:true}))}>📋 Pegar texto</button>
            </div>
            {!pasteMode.pax ? (
              <>
                <label className={"upzone "+(files.pax?"ok":"")} style={{display:"block",marginBottom:8}}>
                  <input type="file" accept=".docx,.doc,.pdf" onChange={e=>setFiles(p=>({...p,pax:e.target.files[0]||null}))}/>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:"1.3rem"}}>📋</span>
                    <div>
                      <div style={{color:files.pax?"#22c55e":"#E8EDF8",fontWeight:600,fontSize:".88rem"}}>Lista de Concursantes</div>
                      <div style={{color:"#4B5A78",fontSize:".74rem"}}>{files.pax?"✓ "+files.pax.name:"Word (.docx) o PDF — un nombre por línea"}</div>
                    </div>
                  </div>
                </label>
                <button className="btn btn-ghost" style={{width:"100%"}} disabled={busy||!files.pax} onClick={doLoadContestants}>{busy?"⏳ Cargando...":"📥 Cargar Lista"}</button>
              </>
            ) : (
              <>
                <textarea className="field" rows={8} placeholder={"1. Carlos Ernesto Martínez\n2. Ana Sofía Rivas\n3. José Daniel Portillo\n..."} value={pasteTexts.pax} onChange={e=>setPasteTexts(p=>({...p,pax:e.target.value}))} style={{resize:"vertical",fontFamily:"inherit",marginBottom:8}}/>
                <button className="btn btn-ghost" style={{width:"100%"}} disabled={busy||!pasteTexts.pax.trim()} onClick={doLoadContestants}>{busy?"⏳ Procesando...":"📥 Cargar desde texto"}</button>
              </>
            )}

            {/* Participant list with edit/delete/add */}
            {gs?.contestants?.length>0 && (
              <div style={{marginTop:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <p style={{color:"#4B5A78",fontSize:".72rem",fontWeight:700,letterSpacing:".05em"}}>{gs.contestants.length} CONCURSANTES {gs.contestantsConfirmed?"✅ CONFIRMADOS":"— SIN CONFIRMAR"}</p>
                  {gs.contestantsConfirmed && <button className="btn btn-ghost" style={{padding:"3px 10px",fontSize:".72rem"}} onClick={()=>upd(prev=>({...prev,contestantsConfirmed:false}))}>✏️ Editar</button>}
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:240,overflowY:"auto"}}>
                  {gs.contestants.map((c,i)=>(
                    <div key={c.id} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 10px",background:"rgba(255,255,255,.04)",borderRadius:8}}>
                      <span style={{color:"#4B5A78",fontSize:".72rem",width:20,textAlign:"right",flexShrink:0}}>{i+1}</span>
                      {!gs.contestantsConfirmed ? (
                        <>
                          <input className="field" value={c.name} onChange={e=>doEditContestant(c.id,e.target.value)} style={{flex:1,padding:"4px 8px",fontSize:".84rem"}}/>
                          <button style={{background:"none",border:"none",cursor:"pointer",color:"#ef4444",fontSize:"1rem",padding:"2px 4px"}} onClick={()=>doRemoveContestant(c.id)} title="Eliminar">✕</button>
                        </>
                      ) : (
                        <span style={{flex:1,fontSize:".88rem",color:"#E8EDF8"}}>{c.name}</span>
                      )}
                    </div>
                  ))}
                </div>
                {!gs.contestantsConfirmed && (
                  <div style={{marginTop:8,display:"flex",gap:8}}>
                    <input className="field" id="newNameInput" placeholder="Agregar concursante..." style={{flex:1,fontSize:".84rem"}}
                      onKeyDown={e=>{if(e.key==="Enter"&&e.target.value.trim()){doAddContestant(e.target.value);e.target.value="";}}}/>
                    <button className="btn btn-ghost" style={{padding:"8px 12px",fontSize:".82rem"}}
                      onClick={()=>{const el=document.getElementById("newNameInput");if(el&&el.value.trim()){doAddContestant(el.value);el.value="";}}}
                    >+ Agregar</button>
                  </div>
                )}
                {!gs.contestantsConfirmed && (
                  <button className="btn btn-green" style={{width:"100%",marginTop:10}} onClick={doConfirmContestants}>
                    ✅ Confirmar Lista de Participantes
                  </button>
                )}
              </div>
            )}
          </div>
          {status && <div style={{padding:"9px 13px",background:"rgba(255,255,255,.05)",borderRadius:10,color:"#E8EDF8",fontSize:".83rem",marginBottom:12}}>{status}</div>}
          <button className="btn btn-gold" style={{width:"100%",padding:14,fontSize:"1rem"}}
            disabled={!gs?.contestants?.length||!gs?.banks?.basic?.length||!gs?.contestantsConfirmed}
            onClick={doStart}>
            {!gs?.contestantsConfirmed?"⚠️ Confirma la lista antes de iniciar":"🚀 Iniciar Concurso"}
          </button>
        </div>
      )}
    </div>
  );

  /* SETUP WAIT */
  if (screen==="setup-wait") return (
    <div className="sb" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:20,padding:24}}>
      <style>{CSS}</style>
      <div className="pulse" style={{fontSize:"3.5rem"}}>🐝</div>
      <h2 style={{fontFamily:"'Cormorant Garamond',serif",color:"#E8A200",fontSize:"2.2rem",fontWeight:700}}>Esperando configuración...</h2>
      {gs?.institution && <p style={{color:"#4B5A78"}}>{gs.institution}{gs?.level?" · "+gs.level:""}</p>}
      <div className="card" style={{textAlign:"center"}}>
        <p style={{color:"#4B5A78",fontSize:".76rem",fontWeight:700,letterSpacing:".05em",marginBottom:4}}>CONECTADO COMO</p>
        <p style={{color:"#E8A200",fontSize:"1.15rem",fontWeight:700}}>{gs?.judges?.find(jj=>jj.id===role)?.name||(role==="mc"?gs?.mc?.name:null)||(role==="presenter"?gs?.presenter?.name:null)||nameIn||role}</p>
        <p style={{color:"#2D3A55",fontSize:".72rem",marginTop:4}}>🟢 Firebase · Sala {roomId}</p>
      </div>
    </div>
  );

  /* RESULTS */
  if (screen==="results") {
    const getC = id => gs?.contestants?.find(c=>c.id===id);
    const allDone = judgeCount>0 && confirmedCount>=judgeCount;
    return (
      <div className="sb" style={{maxWidth:600,margin:"0 auto",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:24,gap:20}}>
        <style>{CSS}</style>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:"3rem"}}>🏆</div>
          <h1 style={{fontFamily:"'Cormorant Garamond',serif",color:"#E8A200",fontSize:"2.8rem",fontWeight:700}}>Resultados Finales</h1>
          {gs?.institution && <p style={{color:"#4B5A78",fontSize:".85rem",marginTop:4}}>{gs.institution}{gs?.level?" · "+gs.level:""}</p>}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:12,width:"100%",maxWidth:420}}>
          {[{key:"first",emoji:"🥇",label:"Primer Lugar",color:"#F2A900",bg:"rgba(242,169,0,.13)"},{key:"second",emoji:"🥈",label:"Segundo Lugar",color:"#B8B8B8",bg:"rgba(184,184,184,.09)"},{key:"third",emoji:"🥉",label:"Tercer Lugar",color:"#CD7F32",bg:"rgba(205,127,50,.09)"}].map(({key,emoji,label,color,bg})=>(
            <div key={key} className="card fade-up" style={{background:bg,borderColor:color+"35",display:"flex",alignItems:"center",gap:14}}>
              <span style={{fontSize:"2.5rem"}}>{emoji}</span>
              <div>
                <div style={{color:"#4B5A78",fontSize:".72rem",fontWeight:700,letterSpacing:".05em"}}>{label}</div>
                <div style={{color,fontFamily:"'Cormorant Garamond',serif",fontSize:"1.55rem",fontWeight:700}}>{getC(gs?.results?.[key])?.name||"—"}</div>
              </div>
            </div>
          ))}
        </div>

        <div className="card" style={{width:"100%",maxWidth:420,borderColor:"rgba(99,102,241,.35)"}}>
          <p style={{color:"#a5b4fc",fontSize:".8rem",fontWeight:700,letterSpacing:".04em",marginBottom:6}}>🖨️ ACTAS PDF — TAMAÑO OFICIO HORIZONTAL</p>
          {isJudge && (
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <p style={{color:"#4B5A78",fontSize:".76rem",lineHeight:1.6}}>
                Descarga tu acta, guárdala o imprímela. La sala se cerrará 36 horas después de que todos confirmen.
              </p>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:4}}>
                {(gs?.judges||[]).map(j=>({id:j.id,name:j.name})).map(({id,name})=>(
                  <span key={id} style={{fontSize:".74rem",padding:"3px 10px",borderRadius:12,
                    background:gs?.pdfConfirmed?.[id]?"rgba(34,197,94,.15)":"rgba(255,255,255,.06)",
                    color:gs?.pdfConfirmed?.[id]?"#22c55e":"#4B5A78",
                    border:"1px solid "+(gs?.pdfConfirmed?.[id]?"rgba(34,197,94,.35)":"rgba(255,255,255,.1)")}}>
                    {gs?.pdfConfirmed?.[id]?"✓ ":"○ "}{name}
                  </span>
                ))}
              </div>
              {!gs?.pdfConfirmed?.[role] ? (
                <button className="btn btn-pdf" style={{width:"100%",padding:13,fontSize:".95rem"}} onClick={doPrintAndConfirm}>
                  📄 Descargar / Imprimir mi Acta y Confirmar
                </button>
              ) : (
                <div style={{textAlign:"center",padding:"8px 0"}}>
                  <p style={{color:"#22c55e",fontSize:".84rem",marginBottom:6}}>✅ Tu acta fue confirmada.</p>
                  {!allDone && <p style={{color:"#4B5A78",fontSize:".76rem"}}>Esperando a los demás jurados ({confirmedCount}/{judgeCount})...</p>}
                  {allDone && <p style={{color:"#22c55e",fontSize:".84rem",fontWeight:700}}>✅ Todos confirmaron — sala cierra en 36h.</p>}
                </div>
              )}
            </div>

          )}
          {(isMC||isPresenter||isCreator) && !isJudge && (
            <div style={{display:"flex",flexDirection:"column",gap:10,padding:"8px 0"}}>
              <p style={{color:"#4B5A78",fontSize:".82rem",lineHeight:1.6}}>
                {isCreator?"Como configurador puedes descargar el acta de cada jurado:":""}
              </p>
              {isCreator && (gs?.judges||[]).map(j=>(
                <button key={j.id} className="btn btn-pdf" style={{width:"100%",padding:10,justifyContent:"flex-start",gap:10,fontSize:".84rem"}}
                  onClick={()=>doPrintJudgeActa(j.id)}>
                  📄 Acta de {j.name}
                </button>
              ))}
              <p style={{color:"#4B5A78",fontSize:".74rem",marginTop:6}}>
                Confirmaciones de jurados: {confirmedCount}/{judgeCount} {allDone?"✅":"⏳"}
              </p>
              {allDone && <p style={{color:"#22c55e",fontSize:".78rem"}}>La sala se cerrará 36 horas después de la última confirmación.</p>}
            </div>
          )}
        </div>
      </div>
    );
  }

  /* COMPETITION */
  if (!gs || screen!=="competition") return (
    <div className="sb" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <style>{CSS}</style>
      <p className="pulse" style={{color:"#4B5A78"}}>Cargando...</p>
    </div>
  );

  return (
    <div className="sb" style={{maxWidth:680,margin:"0 auto",padding:"16px 14px 80px"}}>
      <style>{CSS}</style>
      {LtrModal}{OvrModal}{DisputeModal}

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,paddingTop:6}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span>🐝</span>
          <span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 13px",borderRadius:18,fontSize:".74rem",fontWeight:700,background:stCol+"1A",border:"1px solid "+stCol+"45",color:stCol}}>
            Etapa {cfg?.label}
            {gs.stage==="tiebreaker"&&gs.tbRound>0&&<span style={{opacity:.7}}> · Ronda {gs.tbRound+1}</span>}
          </span>
          {(isMC||isCreator)&&<span style={{fontSize:".68rem",color:"#2D3A55",marginLeft:8}}>{active.length} activos</span>}
        </div>
        <div style={{color:"#4B5A78",fontSize:".76rem"}}>{isMC?(gs?.mc?.name||"Maestro de Ceremonia"):isPresenter?(gs?.presenter?.name||"Presentador"):myJudge?.name||"Jurado"}</div>
      </div>

      {/* Dispute indicator */}
      {pendingDisputes.length>0 && (
        <button className="btn" style={{width:"100%",marginBottom:10,background:"rgba(251,191,36,.15)",color:"#fbbf24",border:"1px solid rgba(251,191,36,.35)",padding:10,fontSize:".84rem"}} onClick={()=>setDisputeModal(true)}>
          ⚠️ Hay {pendingDisputes.length} discrepancia(s) pendiente(s) — Clic para deliberar
        </button>
      )}
      {/* Concursante actual */}
      {cur && !gs.stageComplete && (
        <div className="card fade-up" style={{marginBottom:14,borderColor:stCol+"35"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <p style={{color:"#4B5A78",fontSize:".68rem",fontWeight:700,letterSpacing:".07em",marginBottom:4}}>CONCURSANTE ACTUAL</p>
              <h2 style={{fontFamily:"'Cormorant Garamond',serif",color:"#E8EDF8",fontSize:"1.65rem",fontWeight:700}}>{cur.name}</h2>
            </div>
            <div style={{textAlign:"right"}}>
              <p style={{color:"#4B5A78",fontSize:".68rem",fontWeight:700,letterSpacing:".07em",marginBottom:4}}>PALABRA</p>
              <p style={{color:"#E8EDF8",fontWeight:700}}>{gs.stage==="tiebreaker"?"Desempate":(gs.slot+1)+" / "+wpr}</p>
            </div>
          </div>
          {gs.stage!=="tiebreaker" && (
            <div style={{display:"flex",gap:5,marginTop:10}}>
              {Array.from({length:wpr}).map((_,i)=>{
                const sv=gs.scores[gs.stage]?.[cur.id]?.v?.[i];
                return <div key={i} className="dot" style={{background:sv==="correct"?"#22c55e":sv==="incorrect"?"#ef4444":i===gs.slot&&!aw?stCol+"60":"rgba(255,255,255,.1)"}}/>;
              })}
            </div>
          )}
        </div>
      )}

      {/* Área de Concurso — Flujo por fases */}
      {!gs.stageComplete && (
        <div className="card" style={{marginBottom:14,minHeight:220,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:18}}>

          {/* IDLE */}
          {(!gs.wordPhase||gs.wordPhase==="idle") && (
            <div style={{textAlign:"center"}}>
              <p style={{color:"#4B5A78",marginBottom:18}}>El concurso está listo para comenzar.</p>
              {(isMC||isCreator) && <button className="btn btn-gold" style={{padding:"12px 32px"}} onClick={doStartContestants}>▶ Iniciar Concurso</button>}
              {!isMC&&!isCreator&&<p style={{color:"#2D3A55"}}>Esperando al Maestro de Ceremonia...</p>}
            </div>
          )}

          {/* CONTESTANT REVEAL — judges press ready */}
          {gs.wordPhase==="contestant_reveal" && cur && (
            <div style={{textAlign:"center",width:"100%"}} className="fade-up">
              {isPresenter && (
                <>
                  <p style={{color:"#4B5A78",fontSize:".75rem",marginBottom:8}}>Próximo concursante:</p>
                  <p className="word-font" style={{fontSize:"2rem",color:"#E8A200"}}>{cur.name}</p>
                </>
              )}
              {isJudge && (
                <>
                  <p style={{color:"#4B5A78",fontSize:".8rem",marginBottom:8}}>Concursante:</p>
                  <p className="word-font" style={{fontSize:"2rem",color:"#E8EDF8",marginBottom:16}}>{cur.name}</p>
                  <button className="btn btn-gold" style={{padding:"13px 36px"}}
                    onClick={doJudgeReady} disabled={!!(gs.judgesReady||{})[role]}>
                    {(gs.judgesReady||{})[role]?"✅ Listo":"✋ Listo — presiona cuando estés preparado"}
                  </button>
                  <p style={{color:"#4B5A78",fontSize:".72rem",marginTop:8}}>
                    Listos: {Object.keys(gs.judgesReady||{}).length}/{numJudges}
                  </p>
                </>
              )}
              {(isMC||isCreator) && (
                <>
                  <p style={{color:"#4B5A78",fontSize:".8rem",marginBottom:6}}>En turno:</p>
                  <p className="word-font" style={{fontSize:"2rem",color:"#E8EDF8"}}>{cur.name}</p>
                  <p style={{color:"#2D3A55",fontSize:".8rem",marginTop:10}}>
                    Esperando que los {numJudges} jurados confirmen listos... ({Object.keys(gs.judgesReady||{}).length}/{numJudges})
                  </p>
                </>
              )}
            </div>
          )}

          {/* WORD SHOW */}
          {gs.wordPhase==="word_show" && cur && (()=>{
            const cw=(gs.currentWords||[])[gs.currentWordIdx||0];
            const wi=gs.currentWordIdx||0;
            const myVote=((gs.wordJudgments||{})[wi]||{})[role];
            const totalVotes=Object.keys((gs.wordJudgments||{})[wi]||{}).length;
            return (
              <div style={{width:"100%",textAlign:"center"}} className="pop">
                <p style={{color:"#4B5A78",fontSize:".72rem",marginBottom:4}}>{cur.name} — Palabra {wi+1} de 3</p>
                <div className="word-font" style={{fontSize:"clamp(1.8rem,5vw,3rem)",marginBottom:8,color:"#22c55e"}}>{(cw?.word||"").toUpperCase()}</div>
                <div className="ph-font" style={{fontSize:"1rem",marginBottom:14}}>{cw?.phonetic||""}</div>
                {isJudge && !myVote && (
                  <div style={{display:"flex",gap:10,justifyContent:"center"}}>
                    <button className="btn btn-green" style={{padding:"11px 22px"}} onClick={()=>doJudgeWordVerdict("correct",null)}>✅ Correcta</button>
                    <button className="btn btn-red" style={{padding:"11px 22px"}} onClick={()=>doJudgeWordVerdict("incorrect",null)}>❌ Incorrecta</button>
                  </div>
                )}
                {isJudge && myVote && (
                  <p style={{fontWeight:700,color:myVote.verdict==="correct"?"#22c55e":"#ef4444"}}>
                    {myVote.verdict==="correct"?"✅ Marcaste: Correcta":"❌ Marcaste: Incorrecta"}
                  </p>
                )}
                {!isJudge && <p style={{color:"#4B5A78"}}>{totalVotes}/{numJudges} jurados calificaron</p>}
              </div>
            );
          })()}

          {/* DELIBERATION */}
          {gs.wordPhase==="deliberation" && (()=>{
            const unresolved=(gs.discrepancies||[]).filter(d=>!d.resolved);
            const disc=unresolved[0];
            if(!disc) return null;
            const discIdx=(gs.discrepancies||[]).findIndex(d=>!d.resolved);
            return (
              <div style={{width:"100%"}} className="fade-up">
                <p style={{color:"#fbbf24",fontWeight:700,fontSize:".8rem",marginBottom:8}}>⚠ DISCREPANCIA — Palabra {(disc.wordIdx||0)+1}</p>
                <div className="word-font" style={{fontSize:"1.8rem",textAlign:"center",marginBottom:4}}>{(disc.word||"").toUpperCase()}</div>
                <div className="ph-font" style={{textAlign:"center",marginBottom:12,fontSize:".9rem"}}>{disc.phonetic||""}</div>
                {isPresenter && <p style={{color:"#4B5A78",textAlign:"center"}}>Los jurados están deliberando. El siguiente concursante es: <strong style={{color:"#E8A200"}}>{(gs.contestants?.filter(c=>c.active)||[])[(gs.cIdx||0)+1]?.name||"—"}</strong></p>}
                {!isPresenter && (
                  <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap",marginBottom:10}}>
                    {Object.entries(disc.votes||{}).map(([jid,v])=>{
                      const judgeObj=(gs.judges||[]).find(j=>j.id===jid);
                      const lastName=(judgeObj?.name||jid).split(" ")[1]||(judgeObj?.name||jid);
                      return (
                        <button key={jid} className="btn" onClick={()=>doResolveDiscrepancy(discIdx,v)} style={{
                          flexDirection:"column",gap:2,padding:"9px 14px",
                          background:v==="correct"?"rgba(34,197,94,.15)":"rgba(248,113,113,.15)",
                          color:v==="correct"?"#22c55e":"#f87171",
                          border:"1px solid "+(v==="correct"?"rgba(34,197,94,.4)":"rgba(248,113,113,.4)")}}>
                          <span>{v==="correct"?"✅ Correcta":"❌ Incorrecta"}</span>
                          <span style={{fontSize:".68rem",opacity:.75}}>{lastName}</span>
                        </button>
                      );
                    })}
                    <button className="btn btn-ghost" style={{flexDirection:"column",gap:2,padding:"9px 12px"}}
                      onClick={()=>{
                        const r=window.prompt("Resultado definitivo (correct / incorrect):");
                        if(r==="correct"||r==="incorrect") doResolveDiscrepancy(discIdx,r);
                      }}>
                      <span>✏️</span><span style={{fontSize:".72rem"}}>Editar</span>
                    </button>
                  </div>
                )}
                <p style={{color:"#4B5A78",fontSize:".72rem",textAlign:"center"}}>{unresolved.length} discrepancia(s) pendiente(s)</p>
              </div>
            );
          })()}

          {/* STAGE END per contestant */}
          {gs.wordPhase==="stage_end" && cur && (
            <div style={{textAlign:"center"}} className="fade-up">
              <p style={{color:"#22c55e",fontWeight:700,fontSize:"1rem",marginBottom:10}}>✅ {cur.name} completó sus palabras</p>
              {(isMC||isCreator) && (
                <button className="btn btn-gold" style={{padding:"12px 28px"}} onClick={doNextContestant}>
                  {(gs.contestants?.filter(c=>c.active)||[]).length > (gs.cIdx||0)+1 ? "▶ Siguiente Concursante" : "📊 Ver Resultados de Etapa"}
                </button>
              )}
              {!isMC&&!isCreator&&<p style={{color:"#4B5A78"}}>Esperando al Maestro de Ceremonia...</p>}
            </div>
          )}

        </div>
      )}
{gs.stageComplete && (
        <div className="card fade-up" style={{marginBottom:14,borderColor:"rgba(232,162,0,.5)"}}>
          <h3 style={{fontFamily:"'Cormorant Garamond',serif",color:"#E8A200",fontSize:"1.4rem",marginBottom:14}}>
            Etapa {cfg?.label} — {gs.stage==="tiebreaker"?"Ronda "+(gs.tbRound+1)+" completada":"Resultados"}
          </h3>

          {/* ── HOST: animated reveal ── */}
          {(isMC||isCreator) && !gs.advancing.length && (
            <p style={{color:"#4B5A78",fontSize:".84rem",textAlign:"center"}}>⏳ Esperando que los jurados entreguen resultados...</p>
          )}
          {(isMC||isCreator) && gs.advancing.length>0 && !revealAdvancing && (
            <div style={{textAlign:"center",padding:"20px 0"}}>
              <p style={{color:"#4B5A78",fontSize:".82rem",marginBottom:16}}>
                {gs.stage==="tiebreaker"?"Los jurados han definido el desempate.":"Los jurados entregaron los resultados de esta etapa."}
              </p>
              <button className="btn" onClick={()=>setRevealAdvancing(true)} style={{
                background:"linear-gradient(135deg,#E8A200,#FF7700)",color:"#0C1628",
                padding:"18px 44px",fontSize:"1.1rem",letterSpacing:".08em",borderRadius:16,
                boxShadow:"0 5px 28px rgba(232,162,0,.45)",animation:"pulse 1.5s infinite"
              }}>
                {gs.stage==="tiebreaker"
                  ?(canResolveTop3(ranked)?"🏆 Ver Resultado Final":"➕ Nueva Ronda de Desempate")
                  :"➡️ Ver Siguiente Etapa"}
              </button>
            </div>
          )}
          {(isMC||isCreator) && gs.advancing.length>0 && revealAdvancing && (
            <div className="fade-up">
              {gs.stage!=="tiebreaker" && (
                <div style={{marginBottom:14}}>
                  <p style={{color:"#22c55e",fontWeight:700,fontSize:".8rem",marginBottom:8,letterSpacing:".04em"}}>
                    ✅ PARTICIPANTES QUE AVANZAN A {nextCfg?.label?.toUpperCase()||"LA SIGUIENTE ETAPA"}
                  </p>
                  {gs.advancing.map(id=>{
                    const c=gs.contestants.find(x=>x.id===id);
                    return c?(<div key={id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"rgba(34,197,94,.1)",borderRadius:10,marginBottom:6,border:"1px solid rgba(34,197,94,.25)"}}>
                      <span style={{color:"#22c55e",fontSize:"1.1rem"}}>✅</span>
                      <span style={{color:"#E8EDF8",fontWeight:600}}>{c.name}</span>
                    </div>):null;
                  })}
                  {ranked.filter(c=>!gs.advancing.includes(c.id)).length>0&&(
                    <div style={{marginTop:10}}>
                      <p style={{color:"#ef4444",fontWeight:700,fontSize:".8rem",marginBottom:8,letterSpacing:".04em"}}>❌ ELIMINADOS EN ESTA ETAPA</p>
                      {ranked.filter(c=>!gs.advancing.includes(c.id)).map(c=>(
                        <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",background:"rgba(239,68,68,.07)",borderRadius:10,marginBottom:5,border:"1px solid rgba(239,68,68,.2)"}}>
                          <span style={{color:"#ef4444",fontSize:"1rem"}}>❌</span>
                          <span style={{color:"#6B7FA3"}}>{c.name}</span>
                          <span style={{marginLeft:"auto",color:"#4B5A78",fontSize:".78rem"}}>{c.correct}/{c.total||wpr} correctas</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
              {gs.stage==="tiebreaker" && (
                <div style={{marginBottom:14}}>
                  <p style={{color:"#a78bfa",fontWeight:700,fontSize:".8rem",marginBottom:8}}>⚡ RONDA DE DESEMPATE {gs.tbRound+1}</p>
                  {ranked.map((c,i)=>(
                    <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"rgba(167,139,250,.08)",borderRadius:10,marginBottom:5,border:"1px solid rgba(167,139,250,.2)"}}>
                      <span style={{color:"#a78bfa",minWidth:20,fontWeight:700}}>{i+1}°</span>
                      <span style={{color:"#E8EDF8",fontWeight:600,flex:1}}>{c.name}</span>
                      <span style={{color:"#a78bfa",fontSize:".78rem"}}>{c.correct}/{c.total||1} correctas</span>
                    </div>
                  ))}
                </div>
              )}
              <button className="btn btn-gold" style={{width:"100%"}} onClick={doAdvance}>
                {gs.stage==="tiebreaker"
                  ?(canResolveTop3(ranked)?"🏆 Confirmar y Ver Resultados Finales":"➕ Iniciar Nueva Ronda de Desempate")
                  :"🚀 Iniciar Etapa "+( nextCfg?.label||"Siguiente")}
              </button>
            </div>
          )}

          {/* ── JUDGES: results + tiebreaker controls ── */}
          {isJudge && (
            <div>
              <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
                {ranked.map((c,i)=>(
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:"rgba(255,255,255,.04)",borderRadius:10}}>
                    <span style={{color:"#4B5A78",fontSize:".78rem",width:18,textAlign:"right"}}>{i+1}</span>
                    <span style={{flex:1,fontSize:".88rem"}}>{c.name}</span>
                    <div style={{display:"flex",gap:3}}>{(c.words||[]).slice(0,wpr).map((vv,vi)=><div key={vi} className="dot" style={{background:vv==="correct"?"#22c55e":vv==="incorrect"?"#ef4444":"rgba(255,255,255,.1)"}}/>)}</div>
                    <span style={{fontSize:".84rem",fontWeight:700,minWidth:32,textAlign:"right",color:c.correct>=2?"#22c55e":c.correct===1?"#f59e0b":"#ef4444"}}>{c.correct}/{c.total||wpr}</span>
                  </div>
                ))}
              </div>
              {!gs.advancing.length && (
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {gs.stage==="tiebreaker" ? (
                    <>
                      <p style={{color:"#4B5A78",fontSize:".78rem",textAlign:"center",marginBottom:4}}>
                        Ronda {gs.tbRound+1} completada. ¿Qué desean hacer?
                      </p>
                      <button className="btn" style={{width:"100%",background:"rgba(167,139,250,.18)",color:"#a78bfa",border:"1px solid rgba(167,139,250,.35)"}}
                        onClick={()=>upd(prev=>({...prev,advancing:ranked.map(c=>c.id),tbRound:prev.tbRound}))}>
                        ➕ Agregar otra ronda de desempate
                      </button>
                      <button className="btn btn-gold" style={{width:"100%"}} onClick={doSubmit}>
                        🏆 Finalizar desempate — Entregar al Monitor
                      </button>
                    </>
                  ) : (
                    <button className="btn btn-gold" style={{width:"100%"}} onClick={doSubmit}>
                      📤 Entregar Resultados al Monitor
                    </button>
                  )}
                </div>
              )}
              {gs.advancing.length>0 && (
                <p style={{color:"#22c55e",fontSize:".84rem",textAlign:"center"}}>✅ Resultados enviados. Esperando al Monitor...</p>
              )}
            </div>
          )}
        </div>
      )}

      {/* Marcador */}
      <div className="card">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10}}>
          <p style={{color:"#4B5A78",fontSize:".72rem",fontWeight:700,letterSpacing:".06em"}}>
            CONCURSANTES — {cfg?.label?.toUpperCase()}
            {gs.stage==="tiebreaker"&&gs.tbLen&&<span style={{color:stCol,marginLeft:6,textTransform:"none",fontWeight:400,letterSpacing:0}}>· {gs.tbLen} letras</span>}
          </p>
          <span style={{color:"#2D3A55",fontSize:".68rem"}}>{active.length} participante{active.length!==1?"s":""}</span>
        </div>
        {ranked.map((c,i)=>(
          <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
            <span style={{color:"#2D3A55",fontSize:".76rem",width:16,textAlign:"right"}}>{i+1}</span>
            <span style={{flex:1,fontSize:".84rem",color:"#E8EDF8"}}>
              {c.name}
              {cur&&cur?.id===c.id&&!gs.stageComplete&&<span style={{marginLeft:6,fontSize:".64rem",background:stCol+"25",color:stCol,padding:"1px 6px",borderRadius:8}}>activo</span>}
            </span>
            <div style={{display:"flex",gap:3}}>{Array.from({length:wpr}).map((_,wi)=>{const vv=(c.words||[])[wi];return <div key={wi} className="dot" style={{width:9,height:9,background:vv==="correct"?"#22c55e":vv==="incorrect"?"#ef4444":"rgba(255,255,255,.1)"}}/>;})}</div>
            <span style={{fontSize:".8rem",color:"#4B5A78",minWidth:28,textAlign:"right"}}>{c.correct}/{c.total||0}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
