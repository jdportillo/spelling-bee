}
function getShareUrl(roomId) {
  return window.location.origin + window.location.pathname + "?room=" + roomId;

/* FIREBASE ARRAY FIX: RTDB converts JS arrays to {0:{},1:{},...} objects.
   Restore all arrays after every Firebase read. */
function fixArrays(data) {
  if(!data||typeof data!=='object') return data;
  function toArr(v){ if(!v) return []; if(Array.isArray(v)) return v; return Object.values(v); }
  if(data.banks){['basic','intermediate','advanced'].forEach(k=>{if(data.banks[k]) data.banks[k]=toArr(data.banks[k]);});}
  if(data.usedWords){['basic','intermediate','advanced'].forEach(k=>{if(data.usedWords[k]) data.usedWords[k]=toArr(data.usedWords[k]);});}
  if(data.contestants) data.contestants=toArr(data.contestants);
  if(data.judges)      data.judges=toArr(data.judges);
  if(data.history)     data.history=toArr(data.history);
  if(data.currentWords) data.currentWords=toArr(data.currentWords);
  if(data.discrepancies) data.discrepancies=toArr(data.discrepancies);
  if(data.advancing)   data.advancing=toArr(data.advancing);
  if(!data.scores) data.scores={basic:{},intermediate:{},advanced:{},tiebreaker:{}};
  if(data.scores){
    ['basic','intermediate','advanced','tiebreaker'].forEach(stage=>{
      if(!data.scores[stage]) data.scores[stage]={};
      Object.keys(data.scores[stage]).forEach(cId=>{
        const sc=data.scores[stage][cId];
        if(sc?.v) sc.v=toArr(sc.v);
        if(sc?.rounds) sc.rounds=toArr(sc.rounds);
      });
    });
  }
  return data;
}

   Each contestant gets: 1 easy word, 1 medium, 1 hard.
   Within each tier words are selected by closest length
   to the stage average (so all contestants get similar
   length words = same visual challenge at the board).
   ══════════════════════════════════════════════════════ */

/* Score a word's difficulty 0–100 */
function scoreDifficulty(word) {
  const clean = word.toLowerCase().replace(/[\s\u2011\-]/g,'');
  let s = clean.length * 3;                          // length is primary
  s += ((clean.match(/[^aeiou]{3,}/g)||[]).length)*4; // consonant clusters
  s += ((clean.match(/[qxzjkwy]/g)||[]).length)*2;    // rare/tricky letters
  s += ((clean.match(/[aeiou]{3,}/g)||[]).length)*2;  // vowel clusters (tricky)
  if (word.includes(' ') || word.includes('-')) s+=5; // multi-word / hyphen
  return s;
}

/* Divide available bank pool into 3 tiers by difficulty score */
function splitTiers(pool) {
  if (!pool.length) return [[],[],[]];
  const sorted=[...pool].sort((a,b)=>scoreDifficulty(a.word)-scoreDifficulty(b.word));
  const t=Math.ceil(sorted.length/3);
  return [sorted.slice(0,t), sorted.slice(t,t*2), sorted.slice(t*2)];
}

/* Pick one word from a tier, preferring length closest to targetLen */
function pickFromTier(tier, targetLen) {
  if (!tier.length) return null;
  if (!targetLen) return tier[Math.floor(Math.random()*tier.length)];
  // Sort by closeness to target length; pick randomly from top 3
  const byLen=[...tier].sort((a,b)=>
    Math.abs(a.word.length-targetLen)-Math.abs(b.word.length-targetLen));
  const top=byLen.slice(0,Math.min(3,byLen.length));
  return top[Math.floor(Math.random()*top.length)];
}

/* Main fair draw: returns [easyWord, mediumWord, hardWord] */
function drawFairWords(bank, usedArr, targetLen) {
  const pool=bank.filter(w=>!usedArr.includes(w.word));
  if (pool.length<3) {
    // fallback: pure random if bank nearly exhausted
    const p=[...pool];
    const out=[];
    for(let i=0;i<Math.min(3,p.length);i++){
      const idx=Math.floor(Math.random()*p.length);
      out.push(p.splice(idx,1)[0]);
    }
    return out;
  }
  const [t1,t2,t3]=splitTiers(pool);
  const w1=pickFromTier(t1,targetLen);
  const w2=pickFromTier(t2.filter(w=>w!==w1),targetLen);
  const w3=pickFromTier(t3.filter(w=>w!==w1&&w!==w2),targetLen);
  return [w1,w2,w3].filter(Boolean);
}

/* ── PHONETICS (dictionaryapi.dev — 100% gratis, sin clave) ── */
async function getPhonetics(words, onProgress) {
  const map = {};
  // Only fetch single-word entries — multi-word phrases return 404 without CORS headers
  const fetchable = words.filter(w => !w.includes(' ') && !w.includes('-') && w.length > 1);
  const BATCH = 4;
  const DELAY = 350; // ms between batches — avoids rate limiting
  for (let i = 0; i < fetchable.length; i += BATCH) {
    const batch = fetchable.slice(i, i+BATCH);
    await Promise.allSettled(batch.map(async word => {
      try {
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), 6000);
        const res = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word), {signal:ctrl.signal});
        if (res.ok) {
          const d = await res.json();
          const ph = d[0]?.phonetic || d[0]?.phonetics?.find(p=>p?.text)?.text || "";
          if (ph) map[word] = ph;
        }
      } catch {}
    }));
    if (onProgress) onProgress(Math.min(i+BATCH, fetchable.length), fetchable.length);
    if (i+BATCH < fetchable.length) await new Promise(r => setTimeout(r, DELAY));
  }
  return map;
}

/* Parse plain text / paste for word bank */
function parseTextBank(text) {
  const entries=[], seen=new Set();
  for (const rawLine of text.split(/[\r\n]+/)) {
    const line=rawLine.trim(); if(!line)continue;
    let matched=false;
    for (const sep of [" | "," - ","	"]) {
      const idx=line.indexOf(sep);
      if(idx>0){
        const w=line.slice(0,idx).trim().toLowerCase();
        const ph=line.slice(idx+sep.length).trim();
        // Skip document headers (e.g. "BASIC LIST - 2025") and non-word entries
        if(/\b(list|basic|intermediate|advanced|extra|round|macmillan)\b/.test(w)){matched=true;break;}
        if(/^\d{4}/.test(ph)){matched=true;break;}
        if(ph.length>80||(ph.match(/\d/g)||[]).length>ph.length/3){matched=true;break;}
        if(/^[a-z][a-z\s'-]*$/.test(w)&&!seen.has(w)){entries.push({word:w.replace(/\s+/g," "),phonetic:ph});seen.add(w);matched=true;break;}
      }
    }
    if(!matched){
      // Try "123 word" numbered list format or plain word
      const numMatch=line.match(/^\d+\.?\s+(.+)$/);
      const wordPart=numMatch?numMatch[1].trim():line;
      for(const part of wordPart.split(/[,;]+/)){
        const w=part.trim().toLowerCase().replace(/\s+/g," ");
        if(w.length>0&&/^[a-z][a-z\s'-]*$/.test(w)&&!seen.has(w)){entries.push({word:w,phonetic:""});seen.add(w);}
      }
    }
  }
  return entries;
}

/* Parse plain text for contestant names */
function parseTextNames(text) {
  return text.split(/[\r\n]+/).map(l=>l.replace(/^\d+[\.\)\-]\s*/,"").trim()).filter(n=>n.length>1&&n.length<80);
}

/* Parse PDF word bank — handles Macmillan 3-column numbered lists */
async function parsePDFWordBank(file) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = async e => {
      try {
        if(!window.pdfjsLib){ resolve([]); return; }
        const pdf = await pdfjsLib.getDocument({data:e.target.result}).promise;
        let allItems = [];
        for(let p=1; p<=pdf.numPages; p++){
          const page = await pdf.getPage(p);
          const tc   = await page.getTextContent();
          for(const item of tc.items){
            const s=item.str.trim();
            if(s) allItems.push({s, x:item.transform[4], y:item.transform[5]});
          }
        }
        // Sort: top-to-bottom, left-to-right
        allItems.sort((a,b)=>(b.y-a.y)||(a.x-b.x));
        // Group items into rows by Y coordinate (tolerance ±4)
        const rows=[]; let row=[], prevY=null;
        for(const {s,y} of allItems){
          if(prevY===null||Math.abs(y-prevY)<=4){ row.push(s); }
          else { if(row.length) rows.push(row.join(' ').trim()); row=[s]; }
          prevY=y;
        }
        if(row.length) rows.push(row.join(' ').trim());
        // Skip junk rows (headers, footers, year-only)
        const JUNK=/\b(macmillan|spelling bee)\b|^words on|representative of|english language|^\d{4}$|^(basic|intermediate|advanced)\s+list|^extra\s+round/i;
        const cleanRows=rows.filter(r=>r.length>1&&!JUNK.test(r));
        // PRIMARY: global regex finds ALL "number + word(s)" patterns per row
        // Works for 3-col ("1 after 44 doctor 85 king") and 1-col ("1. advertisement")
        const entries=[], seen=new Set();
        const STOP=/^(the|and|of|on|in|at|to|a|is|it|be|as|by|or|an|their|high|sound|most)$/;
        const RE=/\d+\.?\s+([a-zA-Z][a-zA-Z\s\u2011\-']{0,38}?[a-zA-Z])(?=\s+\d+\.?|\s*$)/g;
        for(const row of cleanRows){
          if(JUNK.test(row)) continue;
          RE.lastIndex=0;
          let m;
          while((m=RE.exec(row))!==null){
            const w=m[1].trim().replace(/\s+/g,' ').toLowerCase();
            if(w.length<2||w.length>42||w.split(' ').length>5) continue;
            if(STOP.test(w)||JUNK.test(w)) continue;
            if(!seen.has(w)){ entries.push({word:w,phonetic:''}); seen.add(w); }
          }
        }
        // Fallback: "word | phonetic" custom format
        if(entries.length<5){
          const fb=parseTextBank(cleanRows.join('\n'));
          if(fb.length>entries.length){ resolve(fb); return; }
        }
        // Fallback B: item-by-item (non-numbered PDFs)
        if(entries.length<5){
          const fb2=[],s2=new Set();
          for(const {s} of allItems){
            if(!s||s.length<2||s.length>42) continue;
            if(/^\d+$/.test(s)||!/^[a-zA-Z]/.test(s)) continue;
            if(!/^[a-zA-Z][a-zA-Z\s\-']*$/.test(s)||s.split(/\s+/).length>5) continue;
            if(JUNK.test(s)) continue;
            const w=s.replace(/\s+/g,' ').trim().toLowerCase();
            if(w.length<2||s2.has(w)||STOP.test(w)) continue;
            fb2.push({word:w,phonetic:''}); s2.add(w);
          }
          if(fb2.length>entries.length){ resolve(fb2); return; }
        }
        resolve(entries);
      } catch(err){ resolve([]); }
    };
    fr.readAsArrayBuffer(file);
  });
}


/* Parse PDF contestant list — robust line extraction */

/* ── DOCUMENT PARSING ── */
async function parseWordDoc(file) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = async e => {
      try {
        const {value} = await window.mammoth.extractRawText({arrayBuffer:e.target.result});
        const entries=[], seen=new Set();
        for (const rawLine of value.split(/[\r\n]+/)) {
          const line = rawLine.trim(); if (!line) continue;
          let matched = false;
          for (const sep of [" | "," - ","\t"]) {
            const idx = line.indexOf(sep);
            if (idx>0) {
              const w=line.slice(0,idx).trim().toLowerCase();
              const ph=line.slice(idx+sep.length).trim();
              if (/^[a-z][a-z'-]*$/.test(w)&&!seen.has(w)) { entries.push({word:w,phonetic:ph}); seen.add(w); matched=true; break; }
            }
          }
          if (!matched) {
            for (const part of line.split(",")) {
              const w=part.trim().toLowerCase();
              if (w.length>1&&/^[a-z][a-z'-]*$/.test(w)&&!seen.has(w)) { entries.push({word:w,phonetic:""}); seen.add(w); }
            }
          }
        }
        resolve(entries);
      } catch { resolve([]); }
    };
    fr.readAsArrayBuffer(file);
  });
}

async function parseNamesDoc(file) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = async e => {
      try {
        const {value} = await window.mammoth.extractRawText({arrayBuffer:e.target.result});
        resolve(value.split(/[\r\n]+/).map(l=>l.replace(/^\d+[\.\)\-]\s*/,"").trim()).filter(n=>n.length>1&&n.length<80));
      } catch { resolve([]); }
    };
    fr.readAsArrayBuffer(file);
  });
}

/* ── GAME UTILITIES ── */
function pickWord(bank, used, len) {
  let pool = bank.filter(w=>!used.includes(w.word));
  if (len) pool = pool.filter(w=>w.word.length===len);
  if (!pool.length&&len) pool = bank.filter(w=>!used.includes(w.word));
  if (!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function computeVerdict(j) {
  if (!j) return null;
  // If discrepancy was resolved, use the agreed final
  if (j.phase==="agreed" && j.final) {
    const f=j.final;
    if (f.override!==null&&f.override!==undefined) return f.override;
    if (f.err) return "incorrect";
    if (f.start&&f.end) return "correct";
    return "incorrect";
  }
  // Otherwise use the shared live evaluation
  const s=j.shared||j;
  if (s.override!==null&&s.override!==undefined) return s.override;
  if (s.err) return "incorrect";
  if (s.start&&s.end) return "correct";
  return null;
}
function judgeVoteVerdict(v) {
  if (!v) return null;
  if (v.err) return "incorrect";
  if (v.start&&v.end) return "correct";
  return null;
}
function detectDiscrepancy(j) {
  if (!j?.votes) return false;
  const vArr = Object.values(j.votes);
  if (vArr.length < 2) return false;
  const verdicts = vArr.map(v => judgeVoteVerdict(v));
  return verdicts.some(v => v !== verdicts[0]);
}
function getScore(scores, stage, cId) {
  if (!scores) return {correct:0,total:0,words:[]};   // guard: scores undefined
  if (stage==="tiebreaker") {
    const r=scores.tiebreaker?.[cId]?.rounds||[];
    return {correct:r.filter(x=>x==="correct").length,total:r.length,words:r};
  }
  const v=scores[stage]?.[cId]?.v||[];
  return {correct:v.filter(x=>x==="correct").length,total:v.length,words:v};
}
function rankActive(contestants, scores, stage) {
  if(!contestants||!Array.isArray(contestants)) return [];
  return contestants.filter(c=>c.active)
    .map(c=>({...c,...getScore(scores,stage,c.id)}))
    .sort((a,b)=>b.correct-a.correct||a.name.localeCompare(b.name));
}
function canResolveTop3(r) {
  if (!r.length) return false;
  if (r.length<=2) return true;
  return r[0].correct!==r[1].correct && r[1].correct!==r[2].correct;
}
function reasonText(reasons, result) {
  if (result==="correct") return "Correcta";
  if (!reasons) return "Incorrecto";
  if (reasons.override==="correct")   return "Correcto por consenso de jurados";
  if (reasons.override==="incorrect") return "Incorrecto por consenso de jurados";
  const issues=[];
  if (!reasons.start) issues.push("No pronunció al inicio");
  if (!reasons.end)   issues.push("No pronunció al final");
  if (reasons.err) issues.push((reasons.err.type==="skipped"?"Omitió":"Deletreó mal")+" la letra «"+reasons.err.letter.toUpperCase()+"»");
  return issues.length ? issues.join("; ") : "Incorrecto";
}

    : role==="presenter" ? "Presentador"
    : "Judge "+role.replace("J","")+", Order "+judge?.order;
  const date = new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  const getC = id => (Array.isArray(gs?.contestants)?gs.contestants:[]).find(c=>c.id===id);

  /* ── Placement map ── */
  const placeMap = {};
  if (gs.results) {
    if (gs.results.first)  placeMap[gs.results.first]  = { label:"1st Place", emoji:"&#127945;" };
    if (gs.results.second) placeMap[gs.results.second] = { label:"2nd Place", emoji:"&#129352;" };
    if (gs.results.third)  placeMap[gs.results.third]  = { label:"3rd Place", emoji:"&#129353;" };
  }

  const hasTb = gs.history.some(h=>h.stage==="tiebreaker");
  const allC  = gs.contestants||[];

  /* ── Result cell for summary table ── */
  function resCell(cId, stage, slot) {
    const e = gs.history.filter(h=>h.cId===cId&&h.stage===stage)[slot];
    if (!e) return '<td class="rc nd" style="font-size:5.5pt">&ndash;</td>';
    return e.result==="correct"
      ? '<td class="rc ok">&#10003;</td>'
      : '<td class="rc fail">&#10007;</td>';
  }

  /* ── Reason text (English) ── */
  function reasonEn(r, result) {
    if (result==="correct") return "Correct";
    if (!r) return "Incorrect";
    if (r.override==="correct")   return "Correct — judges&rsquo; consensus";
    if (r.override==="incorrect") return "Incorrect — judges&rsquo; consensus";
    const issues=[];
    if (!r.start) issues.push("Did not pronounce the word at the start");
    if (!r.end)   issues.push("Did not pronounce the word at the end");
    if (r.err) issues.push((r.err.type==="skipped"?"Skipped":"Misspelled")
      +" letter &laquo;"+r.err.letter.toUpperCase()+"&raquo;");
    return issues.length ? issues.join("; ") : "Incorrect";

    ? '<img src="'+gs.logoB64+'" style="width:1.6cm;height:1.6cm;object-fit:contain;vertical-align:middle;margin-right:8px" alt="">'

    ? '<th colspan="2" style="background:#3a1680;border:.5px solid #555;padding:3px 4px;text-align:center">Break the Tie</th>'
    : "";

/* ════════════════════════════════════════════════════
   SISTEMA DE USUARIOS MAESTRO / OPERADORES
════════════════════════════════════════════════════ */
const ADMIN_PATH   = "spellingbee/admin";
const ROOMS_PATH   = "spellingbee/rooms";
const DEFAULT_PWD  = "spelldown";

/* Hashing SHA-256 con Web Crypto */
async function hashPwd(pwd) {
  const data = new TextEncoder().encode(pwd + ":jd-sb-salt");
  const buf  = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* Contar salas activas de un usuario */
async function countActiveRooms(username) {
  const snap = await window.rtdb.ref(ROOMS_PATH).once("value");
  const rooms = snap.val()||{};
  return Object.values(rooms).filter(r=>r.state?.createdBy===username&&r.state?.phase!=="archived").length;
}

/* Cargar todos los usuarios operadores */
async function loadAdminUsers() {
  const snap = await window.rtdb.ref(ADMIN_PATH+"/users").once("value");
  const data = snap.val()||{};
  // Enrich with active room count
  const enriched = await Promise.all(Object.entries(data).map(async([username,u])=>{
    const active = await countActiveRooms(username);
    return {...u, username, activeRooms:active};
  }));
  return enriched;
}

/* Crear usuario operador */
async function createAdminUser(username, roomLimit, createdBy) {
  const pwdHash = await hashPwd(DEFAULT_PWD);
  const user = { passwordHash:pwdHash, roomLimit:roomLimit||6, active:true,
    createdAt:Date.now(), createdBy:createdBy||'master', totalCreated:0 };
  await window.rtdb.ref(ADMIN_PATH+"/users/"+username).set(user);
}

/* Resetear contraseña a default */
async function resetAdminUserPwd(username) {
  const hash = await hashPwd(DEFAULT_PWD);
  await window.rtdb.ref(ADMIN_PATH+"/users/"+username+"/passwordHash").set(hash);
}

/* Cambiar límite de salas */
async function setRoomLimit(username, limit) {
  await window.rtdb.ref(ADMIN_PATH+"/users/"+username+"/roomLimit").set(limit);
}

/* Desactivar usuario */
async function toggleAdminUser(username, active) {
  await window.rtdb.ref(ADMIN_PATH+"/users/"+username+"/active").set(active);
}

/* Login de operador */
async function loginOperator(username, password) {
  // Check if it's master
  const masterLogin = await loginMaster(username, password);
  if (masterLogin.ok) return {ok:true, user:{type:"master", username}};
  // Check operator
  const snap = await window.rtdb.ref(ADMIN_PATH+"/users/"+username).once("value");
  const u = snap.val();
  if (!u||!u.active) return {ok:false, err:"Usuario no encontrado o desactivado"};
  const hash = await hashPwd(password);
  if (hash !== u.passwordHash) return {ok:false, err:"Contraseña incorrecta"};
  const active = await countActiveRooms(username);
  return {ok:true, user:{type:"operator",username,roomLimit:u.roomLimit||6,activeRooms:active}};
}

/* Check if master user exists — if not, show first-run setup */
async function ensureMasterExists() {
  const snap = await window.rtdb.ref(ADMIN_PATH+"/master").once("value");
  window._needsMasterSetup = !snap.val();
}

/* Create master user (first-run only) */
async function createMasterUser(username, password) {
  const existing = await window.rtdb.ref(ADMIN_PATH+"/master").once("value");
  if (existing.val()) throw new Error("El usuario maestro ya existe.");
  const pwdHash = await hashPwd(password);
  await window.rtdb.ref(ADMIN_PATH+"/master").set({
    username, passwordHash:pwdHash, createdAt:Date.now()
  });
  window._needsMasterSetup = false;
}

/* Login master with username/password */
async function loginMaster(username, password) {
  const snap = await window.rtdb.ref(ADMIN_PATH+"/master").once("value");
  const m = snap.val();
  if (!m || m.username !== username) return {ok:false, err:"Usuario maestro no encontrado"};
  const hash = await hashPwd(password);
  if (hash !== m.passwordHash) return {ok:false, err:"Contraseña incorrecta"};
  return {ok:true};
}

/* ── CSS ── */
const CSS = `
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0C1628;}
  .sb{min-height:100vh;background:#0C1628;color:#E8EDF8;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;}
  .word-font{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.14em;}
  .ph-font{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:#6B7FA3;}
  .ltr{display:inline-block;padding:2px 3px;border-radius:5px;cursor:pointer;transition:background .1s,color .1s;}
  .ltr:hover{background:rgba(255,255,255,.13);}
  .ltr.skip{color:#fbbf24;text-decoration:underline wavy 1.5px;}
  .ltr.bad{color:#f87171;background:rgba(248,113,113,.2);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:11px;border:none;cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:600;transition:all .18s;white-space:nowrap;line-height:1;}
  .btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
  .btn-gold{background:#E8A200;color:#0C1628;}.btn-gold:not(:disabled):hover{background:#F5AC00;box-shadow:0 4px 18px rgba(232,162,0,.42);transform:translateY(-1px);}
  .btn-green{background:#16a34a;color:#fff;}.btn-green:not(:disabled):hover{background:#15803d;}
  .btn-red{background:#dc2626;color:#fff;}.btn-red:not(:disabled):hover{background:#b91c1c;}
  .btn-ghost{background:rgba(255,255,255,.07);color:#E8EDF8;border:1px solid rgba(255,255,255,.14);}.btn-ghost:not(:disabled):hover{background:rgba(255,255,255,.12);}
  .btn-pdf{background:rgba(99,102,241,.18);color:#a5b4fc;border:1px solid rgba(99,102,241,.35);}.btn-pdf:not(:disabled):hover{background:rgba(99,102,241,.3);}
  .spin-btn{background:linear-gradient(135deg,#E8A200,#FF7700);color:#0C1628;padding:18px 52px;font-size:1.28rem;letter-spacing:.12em;border-radius:16px;box-shadow:0 5px 28px rgba(232,162,0,.45);}
  .spin-btn:not(:disabled):hover{transform:scale(1.05);}
  .card{background:#162038;border-radius:16px;border:1px solid rgba(255,255,255,.07);padding:20px;}
  .check{display:flex;align-items:center;gap:11px;padding:11px 15px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);cursor:pointer;user-select:none;transition:all .15s;}
  .check.on{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.38);}
  .check:not(.on):hover{background:rgba(255,255,255,.09);}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(6px);padding:16px;}
  .upzone{border:2px dashed rgba(255,255,255,.18);border-radius:12px;padding:15px;cursor:pointer;transition:border-color .2s;position:relative;display:block;}
  .upzone:hover{border-color:rgba(232,162,0,.5);}.upzone.ok{border-color:rgba(34,197,94,.6);}
  .upzone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .field{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 13px;color:#E8EDF8;font-size:.9rem;font-family:inherit;outline:none;width:100%;transition:border-color .15s;}
  .field:focus{border-color:rgba(232,162,0,.5);}select.field{cursor:pointer;}
  .word-table{width:100%;border-collapse:collapse;}

/* Error boundary — prevents full blue-screen crash */
class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return{err};}
  componentDidCatch(err,info){console.error("AppError:",err,info);}
  render(){
    if(this.state.err) return React.createElement("div",
      {style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#0C1628",color:"#E8EDF8",gap:16,padding:24,fontFamily:"sans-serif"}},
      React.createElement(BeeLogo,{size:64}),
      React.createElement("h2",{style:{color:"#E8A200",marginBottom:8}},"Ocurrió un error"),
      React.createElement("p",{style:{color:"#4B5A78",fontSize:".9rem",maxWidth:400,textAlign:"center"}},String(this.state.err?.message||"Error inesperado")),
      React.createElement("button",{style:{padding:"10px 24px",background:"#E8A200",color:"#0C1628",border:"none",borderRadius:10,fontWeight:700,cursor:"pointer",fontSize:"1rem"},
        onClick:()=>window.location.reload()},"🔄 Recargar página")
    );
    return this.props.children;
  }
}

  function RtdbStatus() {

    useEffect(()=>{
      if(!window.FIREBASE_OK||!window.rtdb) return;
      const ref = window.rtdb.ref(".info/connected");
      const h = snap => setConnected(snap.val());
      ref.on("value", h);
      return ()=>ref.off("value", h);

    );

function App() {

  const [pasteMode,  setPasteMode]  = useState({basic:false,inter:false,adv:false,pax:false});

  const [adminUser,   setAdminUser]   = useState(null);   // {type,username,roomLimit,activeRooms} or {type:"master",uid,email}
  const [showAdmin,   setShowAdmin]   = useState(false);
  const [userRooms,   setUserRooms]   = useState([]);   // [{id, institution, createdAt, status}]  // show admin overlay
  const [showRoomsPanel, setShowRoomsPanel] = useState(false);
  const [showShare,      setShowShare]      = useState(false);  // share-room overlay
  const [allRooms,       setAllRooms]       = useState([]);  // master: all rooms across users
  const [adminView,   setAdminView]   = useState("login"); // "login"|"dashboard"|"setup-master"
  const [needsMasterSetup, setNeedsMasterSetup] = useState(false);
  const [masterSetupForm, setMasterSetupForm] = useState({username:"",password:"",confirm:""});
  const [adminUsers,  setAdminUsers]  = useState([]);
  const [adminBusy,   setAdminBusy]   = useState(false);
  const [adminStatus, setAdminStatus] = useState("");
  const [adminForm,   setAdminForm]   = useState({username:"",password:"",limit:5});
  const [newUserForm, setNewUserForm] = useState({username:"",limit:5});
  const [operLogin,   setOperLogin]   = useState({username:"",password:""});
  const [disputeModal, setDisputeModal] = useState(false);
  const [markedLetterIdx,setMarkedLetterIdx]=useState(null);
  const [markedReason,setMarkedReason]=useState(null);
  const [revealAdvancing, setRevealAdvancing] = useState(false);

  const gsRef     = useRef(gs);     gsRef.current     = gs;
  const screenRef = useRef(screen); screenRef.current = screen;
  const roomRef   = useRef(roomId); roomRef.current   = roomId;

  /* Init — read ?room= from URL */
  useEffect(() => {
    const room = (new URLSearchParams(window.location.search).get("room")||'').toLowerCase().trim();
    if (!room) { setScreen("landing"); return; }
    setRoomId(room); roomRef.current = room;
    const doCheckRoom = (rid) => {
      setScreen("checking");
      window.rtdb.ref("spellingbee/rooms/"+rid+"/state").once("value").then(snap => {
        const s = fixArrays(snap.val());
        if (!s) { setScreen("room-not-found"); return; }
        if (s.phase==="archived") { setScreen("room-closed"); return; }
        const last = s.lastActivity || s.expiresAt - 72*3600*1000 || 0;
        const actaExpired = s.actasClosedAt && (Date.now()-s.actasClosedAt > 36*3600*1000);
        const expired = actaExpired || (s.expiresAt ? Date.now()>s.expiresAt : (Date.now()-last>72*3600*1000));
        if (expired) {
          window.rtdb.ref("spellingbee/rooms/"+rid+"/state/phase").set("archived");
          setScreen("room-closed"); return;
        }
        setGs(s); setScreen("login");
      }).catch(() => setScreen("room-not-found"));
    };
    if (!window.FIREBASE_OK) {
      const waitAndCheck = () => {
        if (window.FIREBASE_OK) {
          doCheckRoom(room);
        } else {
          setTimeout(waitAndCheck, 80);
        }
      };
      waitAndCheck();
      return;
    }
    doCheckRoom(room);
  }, []);

  /* Firebase real-time subscription */
  useEffect(() => {
    if (!role||!roomId||!window.FIREBASE_OK) return;
    const ref = window.rtdb.ref("spellingbee/rooms/"+roomId+"/state");
    const h = snap => {
      const raw = snap.val(); if (!raw) return;
      const data = fixArrays(raw);
      setGs(prev => JSON.stringify(prev)===JSON.stringify(data) ? prev : data);
      const sc = screenRef.current;
      if (data.phase==="competition" && (sc==="setup"||sc==="setup-wait")) setScreen("competition");
      if (data.phase==="results" && sc!=="results") setScreen("results");
    };
    ref.on("value", h);
    return () => ref.off("value", h);
  }, [role, roomId]);

  /* Save room session on every meaningful state change for reload recovery */
  useEffect(()=>{
    if(!roomId) return;
    const inRoom = ["setup","setup-wait","competition","results"].includes(screen);
    if(inRoom){
      try{
        localStorage.setItem('bee_room_session', JSON.stringify({
          roomId, role, nameIn, screen,
          deviceId: DEVICE_ID,
          ts: Date.now()
        }));
      }catch(e){}
    }
    if(screen==="landing"){
      // Left the room — clear room session
      try{ localStorage.removeItem('bee_room_session'); }catch(e){}
    }
  },[screen, roomId, role, nameIn]);

  useEffect(() => { if(gs?.stage||gs?.stageComplete===false) setRevealAdvancing(false); }, [gs?.stage]);
  useEffect(() => {
    const h=()=>setIsMobile(window.innerWidth<640);
    window.addEventListener("resize",h);
    return()=>window.removeEventListener("resize",h);
  },[]);

  /* Force re-check FIREBASE_OK once Firebase finishes async init */
  useEffect(() => {
    // ── Restore ADMIN session ──
    try {
      const saved = localStorage.getItem('bee_admin_session');
      if (saved) {
        const {user, ts} = JSON.parse(saved);
        const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
        if (user && Date.now() - ts < THIRTY_DAYS) {
          setAdminUser(user);
        } else {
          localStorage.removeItem('bee_admin_session');
        }
      }
    } catch(e) { localStorage.removeItem('bee_admin_session'); }

    // ── Restore ROOM session (role + room after page reload) ──
    try {
      const rs = localStorage.getItem('bee_room_session');
      if (rs) {
        const {roomId:rid, role:rl, nameIn:nm, ts} = JSON.parse(rs);
        const EIGHT_HOURS = 8 * 60 * 60 * 1000;
        if (rid && rl && Date.now() - ts < EIGHT_HOURS) {
          // Wait for Firebase then rejoin
          const rejoin = () => {
            window.rtdb.ref("spellingbee/rooms/"+rid+"/state").once("value").then(snap=>{
              const s = fixArrays(snap.val());
              if (!s || s.phase==="archived") {
                localStorage.removeItem('bee_room_session'); return;
              }
              setGs(s);
              setRoomId(rid);
              roomRef.current = rid;
              setRole(rl);
              setNameIn(nm || "");
              if (rl === "mc" || rl === "presenter" || rl === "config") {
                sessionStorage.setItem("creator-"+rid, "1");
              }
              // Navigate to correct screen
              if (s.phase==="competition")      setScreen("competition");
              else if (s.phase==="setup")       setScreen("setup");
              else if (s.phase==="results")     setScreen("results");
              else                              setScreen("setup");
            }).catch(()=>localStorage.removeItem('bee_room_session'));
          };
          if (window.FIREBASE_OK) rejoin();
          else window.addEventListener('firebase-ready', rejoin, {once:true});
        } else {
          localStorage.removeItem('bee_room_session');
        }
      }
    } catch(e) { localStorage.removeItem('bee_room_session'); }

    const checkMaster = () => ensureMasterExists().then(()=>{
      if(window._needsMasterSetup) setNeedsMasterSetup(true);
    }).catch(e=>{
      console.error("ensureMasterExists failed:", e.code, e.message);
      if(e.code==="PERMISSION_DENIED" || e.message?.includes("permission"))
        console.error("→ RTDB rules are blocking access. Check firebase-rules.json");
    });
    if (window.FIREBASE_OK) { checkMaster(); return; }
    const onReady = () => { checkMaster(); setScreen(s => s); };
    window.addEventListener('firebase-ready', onReady);
    // After 12s, if still not ready, show error
    const timeout = setTimeout(() => {
      if (!window.FIREBASE_OK) setScreen("firebase-error");
    }, 12000);
    return () => { window.removeEventListener('firebase-ready', onReady); clearTimeout(timeout); };
  }, []);

  const upd = useCallback(fn => {
    setGs(prev => {
      const base = typeof fn==="function" ? fn(prev||initState()) : fn;
      const next = {...base, lastActivity:Date.now()};
      if (roomRef.current && window.FIREBASE_OK)
        window.rtdb.ref("spellingbee/rooms/"+roomRef.current+"/state").set(next)
          .catch(e=>{
            if(e.code==="PERMISSION_DENIED")
              console.error("🔥 RTDB REGLAS: acceso denegado. Ve a Firebase Console → RTDB → Reglas y pon .read:true .write:true");
            else console.error("🔥 RTDB write error:", e.code, e.message);
          });
      return next;
    });
  }, []);

  /* ── ADMIN HANDLERS ── */
  // Google login removed;

  const doOperatorLogin = async () => {
    if (!operLogin.username||!operLogin.password) return;
    setAdminBusy(true); setAdminStatus("");
    const res = await loginOperator(operLogin.username, operLogin.password);
    if (res.ok) {
      setAdminUser(res.user);
      // Persist session for PWA — survives close/reopen
      try{ localStorage.setItem('bee_admin_session', JSON.stringify({user:res.user, ts:Date.now()})); }catch(e){}
      if (res.user.type==="master") {
        const users = await loadAdminUsers();
        setAdminUsers(users);
        setAdminView("dashboard");
      } else {
        setShowAdmin(false);
      }
    } else {
      setAdminStatus("❌ "+res.err);
    }
    setAdminBusy(false);
  };

  const doAdminLogout = async () => {
    try{ localStorage.removeItem('bee_admin_session'); }catch(e){}
    try{ localStorage.removeItem('bee_room_session'); }catch(e){}
    setAdminUser(null); setShowAdmin(false); setAdminView("login"); setOperLogin({username:"",password:""});
  };

  const doCreateAdminUser = async () => {
    if (!newUserForm.username.trim()||!adminUser) return;
    setAdminBusy(true); setAdminStatus("");
    try {
      await createAdminUser(newUserForm.username.trim(), +newUserForm.limit||6, adminUser.username||'master');
      const users = await loadAdminUsers();
      setAdminUsers(users);
      setNewUserForm({username:"",limit:5});
      setAdminStatus("✅ Usuario «"+newUserForm.username.trim()+"» creado. Contraseña: "+DEFAULT_PWD);
    } catch(e) { setAdminStatus("❌ "+e.message); }
    setAdminBusy(false);
  };

  const doResetPwd = async (username) => {
    setAdminBusy(true);
    await resetAdminUserPwd(username);
    setAdminStatus("✅ Contraseña de «"+username+"» restablecida a: "+DEFAULT_PWD);
    setAdminBusy(false);
  };

  const doSetLimit = async (username, limit) => {
    setAdminBusy(true);
    await setRoomLimit(username, +limit);
    const users = await loadAdminUsers();
    setAdminUsers(users);
    setAdminBusy(false);
  };

  const doToggleUser = async (username, active) => {
    await toggleAdminUser(username, active);
    const users = await loadAdminUsers();
    setAdminUsers(users);
  };

  const doRefreshUsers = async () => {
    setAdminBusy(true);
    const users = await loadAdminUsers();
    setAdminUsers(users);
    setAdminBusy(false);
  };

  /* ── CREATE ROOM ── */

  /* Load user's rooms when admin logs in */
  useEffect(()=>{
    if(!adminUser?.username||!window.FIREBASE_OK) return;
    const ref=window.rtdb.ref("spellingbee/userRooms/"+adminUser.username);
    ref.on("value",snap=>{
      if(!snap.val()){setUserRooms([]);return;}
      const rooms=Object.entries(snap.val()).map(([id,d])=>({id,...d}))
        .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      setUserRooms(rooms);
    });
    return ()=>ref.off();
  },[adminUser?.username]);

  /* Load ALL rooms for master admin — real-time */
  useEffect(()=>{
    if(!adminUser||!window.FIREBASE_OK) return;
    if(adminUser.type!=="master") return; // operators only see own rooms via userRooms
    const ref = window.rtdb.ref("spellingbee/rooms");
    ref.orderByChild("lastActivity").on("value", snap=>{
      if(!snap.val()){setAllRooms([]);return;}
      const list = Object.entries(snap.val())

  /* All judges pressed "Listo" — pre-draw 3 words */
  useEffect(()=>{setMarkedLetterIdx(null);setMarkedReason(null);},[gs?.currentWordIdx]);

  const doJudgeReady = useCallback(() => {
    const s=gsRef.current; if(!s) return;
    upd(prev=>{
      const newReady={...prev.judgesReady,[role]:true};
      const numJudges=(prev.judges||[]).length||prev.judgeCount||3;
      const allReady=Object.keys(newReady).length>=numJudges;
      if(!allReady) return {...prev,judgesReady:newReady};
      // Draw 3 words for current contestant — FAIR tiered selection
      const cfg=STAGES[prev.stage];
      const used=[...prev.usedWords[cfg.bank]];
      // Compute average word length already used this stage for length fairness
      const stageScores=prev.scores[prev.stage]||{};
      const usedLengths=used.map(w=>w.length).filter(l=>l>0);
      const targetLen=usedLengths.length
        ? Math.round(usedLengths.reduce((a,b)=>a+b,0)/usedLengths.length)
        : null;
      const drawn=drawFairWords(prev.banks[cfg.bank],used,targetLen);
      const newUsed=[...used,...drawn.map(w=>w.word)];
      return {...prev,judgesReady:newReady,currentWords:drawn,currentWordIdx:0,
        wordJudgments:{},wordPhase:"word_show",
        usedWords:{...prev.usedWords,[cfg.bank]:newUsed}};
    });
  },[role]);

  /* Judge submits verdict for current word */
  const doJudgeWordVerdict = useCallback((verdict, errInfo) => {
    const s=gsRef.current; if(!s) return;
    const wi=s.currentWordIdx;
    upd(prev=>{
      const prevWJ=prev.wordJudgments||{};
      const prevWord=prevWJ[wi]||{};
      const myVote={verdict, err:errInfo||null, ts:Date.now()};
      const updWord={...prevWord,[role]:myVote};
      const newWJ={...prevWJ,[wi]:updWord};
      const numJudges=(prev.judges||[]).length||prev.judgeCount||3;
      const allVoted=Object.keys(updWord).length>=numJudges;
      if(!allVoted) return {...prev,wordJudgments:newWJ};
      // All judges voted — check discrepancies
      const votes=Object.values(updWord);
      const verdicts=votes.map(v=>v.verdict);
      const hasDisc=verdicts.some(v=>v!==verdicts[0]);
      const word=prev.currentWords[wi];
      // Record to history if all agree
      if(!hasDisc){
        const finalV=verdicts[0];
        const active=prev.contestants.filter(c=>c.active);
        const cur=active[prev.cIdx];
        const hEntry={stage:prev.stage,stageLabel:STAGES[prev.stage].label,
          cId:cur?.id,cName:cur?.name,word:word?.word||"",phonetic:word?.phonetic||"",
          result:finalV,reasons:{override:null,err:errInfo,start:true,end:true}};
        const ns={...prev.scores};
        const pv=ns[prev.stage]?.[cur?.id]?.v||[];
        const nv=[...pv]; nv[wi]=finalV;
        ns[prev.stage]={...ns[prev.stage],[cur?.id]:{v:nv}};
        // Move to next word or stage_end
        const nextWi=wi+1;
        const isLast=nextWi>=prev.currentWords.length;
        return {...prev,wordJudgments:newWJ,
          history:[...prev.history,hEntry],scores:ns,
          wordPhase:isLast?"stage_end":"word_show",
          currentWordIdx:isLast?wi:nextWi,
          judgesReady:isLast?{}:prev.judgesReady};
      }
      // Has discrepancy — add to list
      const disc={wordIdx:wi,word:word?.word,phonetic:word?.phonetic,
        votes:Object.fromEntries(Object.entries(updWord).map(([jid,v])=>[jid,v.verdict])),
        resolved:false,final:null};
      return {...prev,wordJudgments:newWJ,
        discrepancies:[...prev.discrepancies,disc],
        wordPhase:"deliberation"};
    });
  },[role]);

  /* Resolve discrepancy — pick one judge's verdict or custom */
  const doResolveDiscrepancy = useCallback((discIdx, finalVerdict) => {
    const s=gsRef.current; if(!s) return;
    upd(prev=>{
      const discs=[...prev.discrepancies];
      discs[discIdx]={...discs[discIdx],resolved:true,final:finalVerdict};
      const allResolved=discs.every(d=>d.resolved);
      if(!allResolved) return {...prev,discrepancies:discs};
      // All resolved — write to history and scores
      const active=prev.contestants.filter(c=>c.active);
      const cur=active[prev.cIdx];
      let newHistory=[...prev.history];
      const ns={...prev.scores};
      for(const d of discs){
        const hEntry={stage:prev.stage,stageLabel:STAGES[prev.stage].label,
          cId:cur?.id,cName:cur?.name,
          word:d.word||"",phonetic:d.phonetic||"",
          result:d.final,reasons:{override:d.final,err:null,start:true,end:true}};
        newHistory=[...newHistory,hEntry];
        const pv=ns[prev.stage]?.[cur?.id]?.v||[];
        const nv=[...pv]; nv[d.wordIdx]=d.final;
        ns[prev.stage]={...ns[prev.stage],[cur?.id]:{v:nv}};
      }
      // Also add non-discrepancy words already in wordJudgments
      return {...prev,discrepancies:discs,history:newHistory,scores:ns,
        wordPhase:"stage_end",judgesReady:{}};
    });
  },[]);

  const doFlagDispute = () => {

  const doResolveDispute = (result, key) => {
    upd(prev=>{
      const dw={...prev.disputedWords};
      if(dw[key]){dw[key]={...dw[key],resolved:true,finalResult:result};}
      // Also update history if that word was already recorded
      const h=[...prev.history];
      const hIdx=h.findIndex(x=>x.stage===prev.stage&&x.cId===dw[key]?.cId&&x.word===dw[key]?.word);
      if(hIdx>=0){h[hIdx]={...h[hIdx],result,reasons:{...(h[hIdx].reasons),override:result}};}
      // Update scores too
      const ns={...prev.scores};

      word:s.activeWord?.word||"", phonetic:s.activeWord?.phonetic||"",
      result:v,
      reasons:{start:(s.judgment?.final||s.judgment?.shared||s.judgment)?.start,end:(s.judgment?.final||s.judgment?.shared||s.judgment)?.end,err:(s.judgment?.final||s.judgment?.shared||s.judgment)?.err,override:(s.judgment?.final||s.judgment?.shared||s.judgment)?.override},
    };
    const nextSlot=s.slot+1;
    if (nextSlot<cfg.wpr) {
      upd(prev=>({...prev,scores:ns,history:[...prev.history,hEntry],activeWord:null,judgment:null,slot:nextSlot}));
    } else {
      const nextIdx=s.cIdx+1;
      if (nextIdx>=active.length) {
        upd(prev=>({...prev,scores:ns,history:[...prev.history,hEntry],activeWord:null,judgment:null,cIdx:0,slot:0,stageComplete:true}));
      } else {
        upd(prev=>({...prev,scores:ns,history:[...prev.history,hEntry],activeWord:null,judgment:null,cIdx:nextIdx,slot:0}));
      }
    }
  };

  const doSubmit = () => {
    const s=gsRef.current; if(!s) return;
    const ranked=rankActive(s.contestants.filter(c=>c.active),s.scores,s.stage);
    let advIds = s.stage==="tiebreaker" ? ranked.map(c=>c.id) : ranked.filter(c=>c.correct>=2).map(c=>c.id);
    if (advIds.length<2 && ranked.length>=2) advIds=ranked.slice(0,2).map(c=>c.id);
    if (!advIds.length) advIds=ranked.slice(0,1).map(c=>c.id);
    upd(prev=>({...prev,advancing:advIds}));
  };

  const doAdvance = () => {
    const s=gsRef.current; if(!s) return;
    const ranked=rankActive(s.contestants.filter(c=>s.advancing.includes(c.id)),s.scores,s.stage);
    const r3=canResolveTop3(ranked);
    if (s.stage==="tiebreaker") {
      if (r3) {
        upd(prev=>({...prev,phase:"results",results:{first:ranked[0]?.id||null,second:ranked[1]?.id||null,third:ranked[2]?.id||null}}));
        setScreen("results");
      } else {
        upd(prev=>({...prev,cIdx:0,slot:0,activeWord:null,judgment:null,stageComplete:false,advancing:[],tbRound:prev.tbRound+1}));
      }
      return;
    }
    if (s.stage==="advanced" && (r3||ranked.length<=2)) {
      upd(prev=>({...prev,phase:"results",results:{first:ranked[0]?.id||null,second:ranked[1]?.id||null,third:ranked[2]?.id||null}}));
      setScreen("results"); return;
    }
    const next=STAGES[s.stage]?.next; if(!next) return;
    upd(prev=>({
      ...prev, stage:next,
      contestants:prev.contestants.map(c=>({...c,active:s.advancing.includes(c.id)})),
      cIdx:0,slot:0,activeWord:null,judgment:null,stageComplete:false,advancing:[],tbLen:null,tbRound:0,
    }));
  };

  const doPrintAndConfirm = () => {
    printReport(gsRef.current, role, () => {
      upd(prev=>{
        const confirmed={...prev.pdfConfirmed,[role]:true};
        const totalJudges=Math.max((prev.judges||[]).length,1);
        const judgesConfirmed=(prev.judges||[]).filter(j=>confirmed[j.id]).length;
        const allDone=judgesConfirmed>0&&judgesConfirmed>=totalJudges;
        // Set actasClosedAt timestamp — room archives 36h later
        const actasClosedAt=allDone&&!prev.actasClosedAt?Date.now():prev.actasClosedAt;
        return {...prev,pdfConfirmed:confirmed,actasClosedAt};
      });
    });
  };

  /* Configurator can print ANY judge's acta */
  const doPrintJudgeActa = (judgeId) => {
    const s=gsRef.current; if(!s) return;
    printReport(s, judgeId, null);
  };

  const doArchive = () => {
    if (!confirm("¿Cerrar definitivamente esta sala? Los nuevos visitantes ya no podrán unirse.")) return;
    upd(prev=>({...prev,phase:"archived"}));
  };

  /* ── DERIVED ── */
  const isMC        = role==="mc";
  const isPresenter = role==="presenter";
  const isJudge     = role && ["J1","J2","J3","J4","J5","J6","J7","J8","J9","J10"].includes(role);
  const isCreator   = !!sessionStorage.getItem("creator-"+roomId);
  const myJudge     = (gs?.judges||[]).find(j=>j.id===role);
  const numJudges   = gs?.judgeCount||3;
  /* Game controller: MC → Presenter → organizer(creator) → first Judge (order 1).
     Lets a judges-only room run with no MC/presenter at all. */
  const primaryJudgeId = ((gs?.judges||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0))[0]||{}).id;
  const noHost      = !gs?.mc?.name && !gs?.presenter?.name;
  const isController = isMC || isPresenter || isCreator || (noHost && isJudge && role===primaryJudgeId);
  const allJudgesReady = (gs?.judges||[]).length>=numJudges && 
    (gs?.judges||[]).every(j=>(gs?.judgesReady||{})[j.id]);
  const active=gs?.contestants?.filter(c=>c.active)||[];
  const cur=active[gs?.cIdx??0];
  const j=gs?.judgment, aw=gs?.activeWord;
  const cfg=gs?.stage&&STAGES[gs.stage]?STAGES[gs.stage]:null;
  const stCol=cfg?.color||"#E8A200", wpr=cfg?.wpr??3;
  const ranked=gs?rankActive(active,gs.scores,gs.stage):[];
  const verdict=computeVerdict(j);
  const wColor=verdict==="correct"?"#22c55e":verdict==="incorrect"||j?.err?"#ef4444":"#22c55e";
  const nextCfg=cfg?.next?STAGES[cfg.next]:null;
  const shareUrl=roomId?getShareUrl(roomId):"";
  const qrUrl=roomId?"https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(shareUrl)+"&color=E8EDF8&bgcolor=162038":"";
  const shareText="🐝 Únete al Spelling Bee"+(gs?.institution?" — "+gs.institution:"")+"\nCódigo de sala: "+roomId+"\n"+shareUrl;
  const doCopyLink=()=>navigator.clipboard.writeText(shareUrl).then(()=>alert("¡Enlace copiado!")).catch(()=>alert("Copia manual:\n"+shareUrl));
  const doNativeShare=async()=>{
    if(navigator.share){ try{ await navigator.share({title:"Spelling Bee — Sala "+roomId, text:shareText, url:shareUrl}); }catch(e){} }
    else { doCopyLink(); }
  };
  const waShareUrl="https://wa.me/?text="+encodeURIComponent(shareText);
  const ShareOverlay = showShare && (
    <div onClick={()=>setShowShare(false)} style={{position:"fixed",inset:0,background:"rgba(6,12,24,.72)",backdropFilter:"blur(4px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div onClick={e=>e.stopPropagation()} className="card" style={{maxWidth:420,width:"100%",borderColor:"rgba(34,197,94,.3)",display:"flex",flexDirection:"column",gap:14,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <h3 style={{fontFamily:"'Cormorant Garamond',serif",color:"#E8A200",fontSize:"1.5rem",fontWeight:700}}>Compartir sala</h3>
          <button onClick={()=>setShowShare(false)} style={{background:"none",border:"none",color:"#4B5A78",fontSize:"1.3rem",cursor:"pointer"}}>✕</button>
        </div>
        <p style={{color:"#4B5A78",fontSize:".8rem",lineHeight:1.5}}>Quien abra el enlace (o escanee el QR) entra directo a esta sala y elige su rol.</p>
        <div style={{display:"flex",justifyContent:"center"}}>
          <img src={qrUrl} alt="QR de la sala" style={{width:200,height:200,borderRadius:12,background:"#162038"}} onError={e=>e.target.style.display="none"}/>
        </div>
        <div style={{textAlign:"center"}}>
          <p style={{color:"#4B5A78",fontSize:".7rem",fontWeight:700,letterSpacing:".06em",marginBottom:3}}>CÓDIGO DE SALA</p>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.8rem",fontWeight:700,color:"#E8A200",letterSpacing:".1em"}}>{roomId}</div>
        </div>
        <div style={{background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",borderRadius:8,padding:"8px 11px",fontSize:".74rem",color:"#a78bfa",wordBreak:"break-all"}}>{shareUrl}</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <button className="btn btn-gold" style={{width:"100%",padding:12}} onClick={doNativeShare}>📤 Compartir…</button>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-ghost" style={{flex:1,padding:10}} onClick={doCopyLink}>📋 Copiar enlace</button>
            <a className="btn btn-ghost" href={waShareUrl} target="_blank" rel="noopener noreferrer" style={{flex:1,padding:10,textAlign:"center",textDecoration:"none",display:"flex",alignItems:"center",justifyContent:"center"}}>💬 WhatsApp</a>
          </div>
        </div>
      </div>
    </div>
  );
  const confirmedCount=(gs?.judges||[]).filter(j=>gs?.pdfConfirmed?.[j.id]).length;
  const judgeCount=Math.max((gs?.judges||[]).length,1);

  /* ── DISPUTE MODAL ── */
  const pendingDisputes = Object.entries(gs?.disputedWords||{}).filter(([k,d])=>!d.resolved);
  const DisputeModal = disputeModal && pendingDisputes.length>0 && (
    <div className="overlay" onClick={()=>setDisputeModal(false)}>
      <div className="card" style={{width:"100%",maxWidth:500,display:"flex",flexDirection:"column",gap:12,maxHeight:"80vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.4rem",color:"#fbbf24"}}>⚠️ Discrepancias Pendientes</h3>
        <p style={{color:"#6B7FA3",fontSize:".8rem"}}>Los siguientes casos requieren deliberación. Seleccionen el resultado acordado:</p>
        {pendingDisputes.map(([key,d])=>(
          <div key={key} style={{background:"rgba(251,191,36,.08)",border:"1px solid rgba(251,191,36,.25)",borderRadius:10,padding:12}}>
            <p style={{color:"#E8EDF8",fontWeight:700,fontSize:".9rem",marginBottom:2}}>{d.word?.toUpperCase()}</p>
            <p style={{color:"#6B7FA3",fontSize:".78rem",marginBottom:4}}>{d.cName} · Etapa {STAGES[d.stage]?.label} · Palabra {(d.slot||0)+1}</p>
            <p style={{color:"#fbbf24",fontSize:".74rem",marginBottom:10}}>⚠ {d.description}</p>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-green" style={{flex:1,padding:10,fontSize:".84rem"}} onClick={()=>{doResolveDispute("correct",key);}}>✅ Correcto</button>
              <button className="btn btn-red"   style={{flex:1,padding:10,fontSize:".84rem"}} onClick={()=>{doResolveDispute("incorrect",key);}}>❌ Incorrecto</button>
            </div>
          </div>
        ))}
        <button className="btn btn-ghost" onClick={()=>setDisputeModal(false)}>Cerrar</button>
      </div>
    </div>
  );

  /* ── MODALS ── */
  const LtrModal = ltrModal && (
    <div className="overlay" onClick={()=>setLtrModal(null)}>
      <div className="card" style={{width:"100%",maxWidth:300,display:"flex",flexDirection:"column",gap:10}} onClick={e=>e.stopPropagation()}>
        <h3 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.5rem"}}>
          Error en «<span style={{color:"#E8A200"}}>{ltrModal.letter.toUpperCase()}</span>»
        </h3>
        <p style={{color:"#6B7FA3",fontSize:".82rem"}}>¿Qué error cometió el concursante?</p>
        <button className="btn" style={{background:"rgba(251,191,36,.15)",color:"#fbbf24",border:"1px solid rgba(251,191,36,.3)",padding:13,width:"100%"}} onClick={()=>doMarkErr("skipped")}>⚡ La omitió / se la saltó</button>
        <button className="btn" style={{background:"rgba(248,113,113,.15)",color:"#f87171",border:"1px solid rgba(248,113,113,.3)",padding:13,width:"100%"}} onClick={()=>doMarkErr("misspelled")}>❌ La deletreó incorrectamente</button>
        <button className="btn btn-ghost" onClick={()=>setLtrModal(null)}>Cancelar</button>
      </div>
    </div>
  );

  const OvrModal = ovrModal && (
    <div className="overlay" onClick={()=>setOvrModal(false)}>
      <div className="card" style={{width:"100%",maxWidth:300,display:"flex",flexDirection:"column",gap:10}} onClick={e=>e.stopPropagation()}>
        <h3 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.5rem"}}>✏️ Corrección por Consenso</h3>
        <p style={{color:"#6B7FA3",fontSize:".82rem"}}>Resultado acordado por los jurados:</p>
        <button className="btn btn-green" style={{padding:13,width:"100%"}} onClick={()=>doOverride("correct")}>✅ Correcto</button>
        <button className="btn btn-red"   style={{padding:13,width:"100%"}} onClick={()=>doOverride("incorrect")}>❌ Incorrecto</button>
        {j?.override!=null && <button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>doOverride(null)}>🗑 Quitar corrección</button>}
        <button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>setOvrModal(false)}>Cancelar</button>
      </div>
    </div>
  );

  /* ══════════════════════════════════════
     SCREENS
  ══════════════════════════════════════ */

  /* INIT spinner */
  /* ── ADMIN MODAL OVERLAY ── */
  const AdminModal = showAdmin && (
    <div className="overlay" style={{zIndex:500,alignItems:"flex-start",paddingTop:40}} onClick={()=>setShowAdmin(false)}>
      <div className="card" style={{width:"100%",maxWidth:520,maxHeight:"88vh",overflowY:"auto",display:"flex",flexDirection:"column",gap:14}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif",color:"#E8A200",fontSize:"1.5rem",fontWeight:700}}>
            {adminView==="login"?"🔐 Acceso":"👑 Panel de Administración"}
          </h2>
          <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:".76rem"}} onClick={()=>setShowAdmin(false)}>✕</button>
        </div>

        {/* ── SETUP MASTER VIEW (first run only) ── */}
        {adminView==="login" && needsMasterSetup && (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div style={{padding:"10px 14px",background:"rgba(167,139,250,.1)",border:"1px solid rgba(167,139,250,.3)",borderRadius:10}}>
              <p style={{color:"#a78bfa",fontSize:".82rem",fontWeight:700,marginBottom:4}}>Primera vez — Crear usuario maestro</p>
              <p style={{color:"#4B5A78",fontSize:".74rem",lineHeight:1.5}}>No hay ningún administrador registrado. Crea el usuario maestro para gestionar el sistema.</p>
            </div>
            <input className="field" placeholder="Nombre de usuario maestro" value={masterSetupForm.username}
              onChange={e=>setMasterSetupForm(p=>({...p,username:e.target.value.replace(/\s/g,"")}))} style={{fontSize:".90rem"}}
              autoComplete="username"/>
            <input className="field" placeholder="Contraseña" type="password" value={masterSetupForm.password}
              onChange={e=>setMasterSetupForm(p=>({...p,password:e.target.value}))} style={{fontSize:".90rem"}}
              autoComplete="new-password"/>
            <input className="field" placeholder="Confirmar contraseña" type="password" value={masterSetupForm.confirm}
              onChange={e=>setMasterSetupForm(p=>({...p,confirm:e.target.value}))}
              onKeyDown={e=>{if(e.key==="Enter"&&masterSetupForm.username&&masterSetupForm.password&&masterSetupForm.password===masterSetupForm.confirm){
                setAdminBusy(true);setAdminStatus("");
                createMasterUser(masterSetupForm.username,masterSetupForm.password)
                  .then(()=>{setNeedsMasterSetup(false);setAdminStatus("Usuario maestro creado. Inicia sesión.");setMasterSetupForm({username:"",password:"",confirm:""});})
                  .catch(e2=>setAdminStatus("Error: "+e2.message))
                  .finally(()=>setAdminBusy(false));
              }}} style={{fontSize:".90rem"}}
              autoComplete="new-password"/>
            {masterSetupForm.password&&masterSetupForm.confirm&&masterSetupForm.password!==masterSetupForm.confirm&&(
              <p style={{color:"#f87171",fontSize:".76rem"}}>Las contraseñas no coinciden</p>
            )}
            <button className="btn btn-gold" style={{width:"100%",padding:13}}
              disabled={adminBusy||!masterSetupForm.username||!masterSetupForm.password||masterSetupForm.password!==masterSetupForm.confirm}
              onClick={()=>{
                setAdminBusy(true);setAdminStatus("");
                createMasterUser(masterSetupForm.username,masterSetupForm.password)
                  .then(()=>{setNeedsMasterSetup(false);setAdminStatus("Usuario maestro creado. Inicia sesión.");setMasterSetupForm({username:"",password:"",confirm:""});})
                  .catch(e2=>setAdminStatus("Error: "+e2.message))
                  .finally(()=>setAdminBusy(false));
              }}>
              {adminBusy?"Creando...":"Crear Usuario Maestro"}
            </button>
            {adminStatus && <p style={{color:adminStatus.startsWith("✅")||adminStatus.startsWith("Usuario")?"#22c55e":"#f87171",fontSize:".82rem"}}>{adminStatus}</p>}
          </div>
        )}

        {/* ── LOGIN VIEW ── */}
        {adminView==="login" && !needsMasterSetup && (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <p style={{color:"#4B5A78",fontSize:".80rem",lineHeight:1.6}}>Ingresa con tu nombre de usuario y contraseña para acceder al sistema.</p>
            <input className="field" placeholder="Nombre de usuario" value={operLogin.username}
              onChange={e=>setOperLogin(p=>({...p,username:e.target.value}))} style={{fontSize:".90rem"}}
              autoComplete="username"/>
            <input className="field" placeholder="Contraseña" type="password" value={operLogin.password}
              onChange={e=>setOperLogin(p=>({...p,password:e.target.value}))}
              onKeyDown={e=>e.key==="Enter"&&doOperatorLogin()} style={{fontSize:".90rem"}}
              autoComplete="current-password"/>
            <button className="btn btn-gold" style={{width:"100%",padding:13}} disabled={adminBusy||!operLogin.username||!operLogin.password} onClick={doOperatorLogin}>
              {adminBusy?"Verificando...":"Iniciar Sesión"}
            </button>
            {adminStatus && <p style={{color:adminStatus.startsWith("✅")?"#22c55e":"#f87171",fontSize:".82rem"}}>{adminStatus}</p>}
          </div>
        )}

        {/* ── DASHBOARD VIEW (master only) ── */}
        {adminView==="dashboard" && (adminUser?.type==="master") && (
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{padding:"8px 12px",background:"rgba(232,162,0,.1)",border:"1px solid rgba(232,162,0,.25)",borderRadius:10}}>
              <p style={{color:"#E8A200",fontSize:".78rem",fontWeight:700}}>👑 Maestro: {adminUser.username}</p>
            </div>

            {/* Create new user */}
            <div style={{borderBottom:"1px solid rgba(255,255,255,.08)",paddingBottom:14}}>
              <p style={{color:"#6B7FA3",fontSize:".72rem",fontWeight:700,letterSpacing:".05em",marginBottom:10}}>➕ CREAR USUARIO OPERADOR</p>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <input className="field" placeholder="Nombre de usuario (sin espacios)" value={newUserForm.username}
                  onChange={e=>setNewUserForm(p=>({...p,username:e.target.value.replace(/\s/g,"")}))} style={{flex:2,fontSize:".85rem"}}/>
                <div style={{flex:1,display:"flex",flexDirection:"column",gap:3}}>
                  <label style={{color:"#4B5A78",fontSize:".65rem"}}>Límite de salas</label>
                  <input className="field" type="number" min={1} max={50} value={newUserForm.limit}
                    onChange={e=>setNewUserForm(p=>({...p,limit:+e.target.value}))} style={{textAlign:"center"}}/>
                </div>
              </div>
              <p style={{color:"#2D3A55",fontSize:".72rem",marginBottom:8}}>Contraseña inicial: <code style={{color:"#a78bfa",background:"rgba(167,139,250,.1)",padding:"1px 6px",borderRadius:4}}>{DEFAULT_PWD}</code></p>
              <button className="btn btn-gold" style={{width:"100%"}} disabled={adminBusy||!newUserForm.username.trim()} onClick={doCreateAdminUser}>
                {adminBusy?"Creando...":"Crear Usuario"}
              </button>
              {adminStatus && <p style={{color:adminStatus.startsWith("✅")?"#22c55e":"#f87171",fontSize:".8rem",marginTop:6}}>{adminStatus}</p>}
            </div>

            {/* User list */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <p style={{color:"#6B7FA3",fontSize:".72rem",fontWeight:700,letterSpacing:".05em"}}>👥 USUARIOS REGISTRADOS ({adminUsers.length})</p>
              <button className="btn btn-ghost" style={{padding:"3px 10px",fontSize:".68rem"}} onClick={doRefreshUsers}>{adminBusy?"⏳":"🔄 Actualizar"}</button>
            </div>
            {adminUsers.length===0&&<p style={{color:"#2D3A55",fontSize:".8rem",textAlign:"center"}}>No hay usuarios creados aún</p>}
            {adminUsers.map(u=>(
              <div key={u.username} style={{background:"rgba(255,255,255,.04)",borderRadius:10,padding:"10px 13px",border:"1px solid rgba(255,255,255,.07)"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
                  <span style={{fontWeight:700,color:u.active?"#E8EDF8":"#3B4B6A",flex:1}}>{u.username}</span>
                  <span style={{fontSize:".72rem",padding:"2px 8px",borderRadius:10,background:u.active?"rgba(34,197,94,.15)":"rgba(239,68,68,.1)",color:u.active?"#22c55e":"#f87171",border:"1px solid "+(u.active?"rgba(34,197,94,.3)":"rgba(239,68,68,.25)")}}>
                    {u.active?"Activo":"Desactivado"}
                  </span>
                  <span style={{fontSize:".72rem",color:"#4B5A78"}}>
                    {u.activeRooms}/{u.roomLimit} salas
                  </span>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:".72rem",color:"#f59e0b",borderColor:"rgba(245,158,11,.3)"}}
                    onClick={()=>doResetPwd(u.username)}>🔑 Resetear contraseña</button>
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <span style={{color:"#4B5A78",fontSize:".72rem"}}>Límite:</span>
                    <input type="number" min={1} max={50} defaultValue={u.roomLimit}
                      onBlur={e=>doSetLimit(u.username,e.target.value)}
                      style={{width:46,background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,padding:"3px 5px",color:"#E8EDF8",fontSize:".78rem",textAlign:"center"}}/>
                  </div>
                  <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:".72rem",color:u.active?"#ef4444":"#22c55e",borderColor:u.active?"rgba(239,68,68,.3)":"rgba(34,197,94,.3)"}}
                    onClick={()=>doToggleUser(u.username,!u.active)}>
                    {u.active?"⛔ Desactivar":"✅ Activar"}
                  </button>
                </div>
                <p style={{color:"#2D3A55",fontSize:".68rem",marginTop:5}}>
                  Creado: {new Date(u.createdAt).toLocaleDateString("es-SV")}
                </p>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );

  if (screen==="init") return (
    <div className="sb" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <style>{CSS}</style>
      <p className="pulse" style={{color:"#4B5A78"}}>Iniciando...</p>
